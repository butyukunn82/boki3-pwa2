<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#173b67"><title>第2問 本番形式</title><style>
:root{--n:#173b67;--b:#2f6fad;--bg:#f4f7fb;--line:#cfdbe7;--good:#147a45;--bad:#b63434}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#243244;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI",Meiryo,sans-serif}.app{max-width:1020px;margin:auto;padding-bottom:82px}.top{position:sticky;top:0;z-index:20;background:var(--n);color:#fff;padding:12px 14px;display:flex;justify-content:space-between;align-items:center}.top a{color:#fff;text-decoration:none}.page{padding:14px}.hero,.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:15px;margin-bottom:12px;box-shadow:0 7px 20px rgba(24,54,91,.06)}.hero{background:linear-gradient(135deg,#173b67,#3479b9);color:#fff}.hero h1{margin:0 0 4px;font-size:1.35rem}.hero p{margin:0;font-size:.83rem;opacity:.92}.note{font-size:.78rem;color:#65758a;line-height:1.6}.modebar{display:flex;gap:7px;overflow:auto;padding:2px 0 10px;scrollbar-width:none}.modebar button{white-space:nowrap;border:1px solid var(--line);background:#fff;color:#36516c;border-radius:999px;padding:8px 11px;font-weight:850}.modebar button.active{background:var(--n);color:#fff;border-color:var(--n)}.section{font-weight:900;color:var(--n);margin:18px 2px 8px}.wrap{overflow:auto}.tbl{border-collapse:collapse;width:100%;min-width:650px;font-size:.82rem}.tbl th,.tbl td{border:1px solid #9eb0c3;padding:7px;text-align:center}.tbl th{background:#eaf0f6}.tbl input,.tbl select,.answer{width:100%;min-height:42px;border:2px solid var(--line);border-radius:8px;background:#fff;padding:7px;font-size:16px}.tbl input{text-align:right}.given{background:#f7f9fc}.question-list{display:grid;gap:10px}.qbox{border:1px solid #dce5ee;border-radius:12px;padding:11px}.qbox b{display:block;margin-bottom:7px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:14px 0}.btn{min-height:50px;border:0;border-radius:12px;font-weight:900;font-size:.95rem}.primary{background:var(--n);color:#fff}.secondary{background:#e7edf4;color:#33465c}.result{display:none}.result.show{display:block}.score{font-size:1.7rem;font-weight:950;color:var(--n)}.ok{border-color:#69bd8e!important;background:#f0fbf5!important}.ng{border-color:#df8b8b!important;background:#fff2f2!important}.explain{margin-top:10px;padding:12px;border-radius:12px;background:#f7f9fc;font-size:.84rem;line-height:1.7}.footer{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);padding:8px;text-align:center}.footer a{display:inline-block;margin:0 9px;color:var(--n);font-weight:800;text-decoration:none;font-size:.82rem}@media(max-width:600px){.page{padding:10px}.actions{grid-template-columns:1fr}.hero h1{font-size:1.18rem}}
</style></head><body><div class="app"><header class="top"><b>第2問　本番形式</b><a href="q2.html">第2問メニューへ</a></header><main class="page"><section class="hero"><h1>帳簿・勘定を直接埋める</h1><p>摘要は選択、金額は自力入力。出題パターンを切り替えて反復します。</p></section><section class="card"><div class="note">公式サンプルで確認できる「複数勘定の空欄」「固定資産台帳」「経過勘定」などの解答動作を参考にしたオリジナル問題です。公式問題の転載ではありません。</div></section><div class="modebar" id="modebar"></div><div id="problem"></div><div class="actions"><button class="btn primary" id="grade">採点する</button><button class="btn secondary" id="next">別の問題</button></div><section class="card result" id="result"><div class="score" id="score"></div><div id="summary"></div><div class="explain" id="explain"></div></section></main></div><div class="footer"><a href="index.html">ホーム</a><a href="q2.html">第2問</a><a href="q3-cbt.html">第3問 本番形式</a></div><script>
const Y=n=>Number(n).toLocaleString('ja-JP'),pick=a=>a[Math.floor(Math.random()*a.length)],shuffle=a=>[...a].sort(()=>Math.random()-.5);let currentMode='random',state=null;
const MODES=[['random','ランダム'],['closing','商品売買・締切'],['dividend','配当・法人税'],['asset','固定資産台帳'],['accrual','経過勘定']];
const theoryBank=[{q:'前期に貸倒処理した売掛金を当期に回収したときの収益勘定は？',a:'償却債権取立益',o:['償却債権取立益','受取利息','雑益','売上']},{q:'未使用の郵便切手を決算で資産へ振り替える勘定は？',a:'貯蔵品',o:['貯蔵品','通信費','消耗品費','前払費用']},{q:'会社負担分の社会保険料を費用計上する勘定は？',a:'法定福利費',o:['法定福利費','福利厚生費','給料','預り金']},{q:'商品以外の固定資産を売却し代金を後日受け取る場合の債権は？',a:'未収入金',o:['未収入金','売掛金','受取手形','前受金']}];
function selectHtml(key,opts){return `<select class="answer" data-key="${key}" data-type="text"><option value="">選択</option>${opts.map(x=>`<option>${x}</option>`).join('')}</select>`}function inputHtml(key){return `<input class="answer" data-key="${key}" data-type="num" inputmode="numeric" placeholder="数字のみ">`}
function theoryHtml(){const qs=shuffle(theoryBank).slice(0,2);state.theory=qs;return `<div class="section">第2問（2）語句選択</div><section class="card question-list">${qs.map((x,i)=>`<div class="qbox"><b>${i+1}. ${x.q}</b><select class="answer" data-theory="${i}"><option value="">選択</option>${shuffle(x.o).map(v=>`<option>${v}</option>`).join('')}</select></div>`).join('')}</section>`}
function makeClosing(){const salesTotal=pick([2500000,2800000,3100000]),purchaseTotal=pick([1600000,1750000,1900000]),openInv=pick([240000,300000,360000]),closeInv=pick([200000,270000,330000]),cogs=openInv+purchaseTotal-closeInv;state={mode:'closing',ans:{salesLabel:'損益',salesTotal,openLabel:'繰越商品',openInv,closeLabel:'繰越商品',closeInv,cogsLabel:'損益',cogs},explain:`売上は期末に損益へ ${Y(salesTotal)}円。売上原価は「期首商品 ${Y(openInv)} ＋ 当期仕入 ${Y(purchaseTotal)} − 期末商品 ${Y(closeInv)} ＝ ${Y(cogs)}円」です。`};const opts=['損益','繰越商品','前期繰越','次期繰越','売上','仕入'];return `<div class="section">第2問（1）商品売買・勘定締切</div><section class="card"><p>3分法を採用しています。期首商品は <b>${Y(openInv)}円</b>、期末商品は <b>${Y(closeInv)}円</b>、当期仕入は <b>${Y(purchaseTotal)}円</b>、当期売上は <b>${Y(salesTotal)}円</b>です。売上原価は仕入勘定で算定します。</p><div class="wrap"><table class="tbl"><tr><th colspan="3">売上</th><th colspan="3">仕入</th></tr><tr><th>日付</th><th>摘要</th><th>金額</th><th>日付</th><th>摘要</th><th>金額</th></tr><tr><td>3/31</td><td>${selectHtml('salesLabel',opts)}</td><td>${inputHtml('salesTotal')}</td><td>4/1</td><td>${selectHtml('openLabel',opts)}</td><td>${inputHtml('openInv')}</td></tr><tr><td class="given">期中</td><td class="given">売掛金ほか</td><td class="given">${Y(salesTotal)}</td><td>3/31</td><td>${selectHtml('closeLabel',opts)}</td><td>${inputHtml('closeInv')}</td></tr><tr><td></td><td></td><td></td><td>3/31</td><td>${selectHtml('cogsLabel',opts)}</td><td>${inputHtml('cogs')}</td></tr><tr><td></td><td></td><td></td><td class="given">期中</td><td class="given">買掛金ほか</td><td class="given">${Y(purchaseTotal)}</td></tr></table></div></section>`+theoryHtml()}
function makeDividend(){const dividend=pick([300000,360000,420000]),reserve=Math.round(dividend*.1),opening=pick([900000,1050000,1200000]),rev=pick([5800000,6200000,6600000]),expense=pick([4200000,4500000,4800000]),pretax=rev-expense,tax=Math.round(pretax*.3),net=pretax-tax,ending=opening-dividend-reserve+net;state={mode:'dividend',ans:{d1:'未払配当金',d1n:dividend,d2:'利益準備金',d2n:reserve,d3:'損益',d3n:net,t1:'法人税、住民税及び事業税',t1n:tax,t2:'未払法人税等',t2n:tax,t3:'繰越利益剰余金',t3n:net},explain:`税引前利益は ${Y(rev)}−${Y(expense)}＝${Y(pretax)}円。法人税等は30%で ${Y(tax)}円、当期純利益は ${Y(net)}円。配当と利益準備金は繰越利益剰余金を減少させます。`};const opts=['未払法人税等','未払配当金','繰越利益剰余金','法人税、住民税及び事業税','利益準備金','前期繰越','次期繰越','損益'];return `<div class="section">第2問（1）配当・法人税・利益振替</div><section class="card"><p>期首の繰越利益剰余金は <b>${Y(opening)}円</b>。株主への配当 <b>${Y(dividend)}円</b> と利益準備金 <b>${Y(reserve)}円</b> を決議しました。決算整理後の収益合計は <b>${Y(rev)}円</b>、法人税等を除く費用合計は <b>${Y(expense)}円</b>。法人税等は税引前利益の30%です。</p><div class="wrap"><table class="tbl"><tr><th colspan="3">繰越利益剰余金</th><th colspan="3">損益</th></tr><tr><th>摘要</th><th>金額</th><th></th><th>摘要</th><th>金額</th><th></th></tr><tr><td>${selectHtml('d1',opts)}</td><td>${inputHtml('d1n')}</td><td>配当</td><td>${selectHtml('t1',opts)}</td><td>${inputHtml('t1n')}</td><td>税額</td></tr><tr><td>${selectHtml('d2',opts)}</td><td>${inputHtml('d2n')}</td><td>積立</td><td>${selectHtml('t2',opts)}</td><td>${inputHtml('t2n')}</td><td>相手科目</td></tr><tr><td>${selectHtml('d3',opts)}</td><td>${inputHtml('d3n')}</td><td>利益振替</td><td>${selectHtml('t3',opts)}</td><td>${inputHtml('t3n')}</td><td>利益振替</td></tr><tr><td class="given">次期繰越</td><td class="given">${Y(ending)}</td><td></td><td></td><td></td><td></td></tr></table></div></section>`+theoryHtml()}
function makeAsset(){const costA=pick([4800000,6000000,7200000]),lifeA=10,depA=costA/lifeA;const costB=pick([3600000,4320000,5040000]),lifeB=6,depB=costB/lifeB;const yearsB=3,accB=depB*yearsB;const costC=pick([3600000,4800000,5400000]),lifeC=4,months=pick([6,9]),depC=Math.round(costC/lifeC*months/12);const accA=depA*5,totalCost=costA+costB+costC,totalAcc=accA+accB,totalBook=totalCost-totalAcc,totalDep=depA+depB+depC;state={mode:'asset',ans:{aDep:depA,bAcc:accB,bBook:costB-accB,cDep:depC,totalAcc,totalBook,totalDep},explain:`定額法は取得原価÷耐用年数。期中取得は月割です。備品Cは ${Y(costC)}÷${lifeC}×${months}/12＝${Y(depC)}円。`};return `<div class="section">第2問（1）固定資産台帳</div><section class="card"><p>残存価額ゼロの定額法です。備品Cは当期中に取得し、当期使用月数は <b>${months}か月</b>です。</p><div class="wrap"><table class="tbl"><tr><th>名称</th><th>取得原価</th><th>耐用年数</th><th>期首減価償却累計額</th><th>期首帳簿価額</th><th>当期減価償却費</th></tr><tr><td>備品A</td><td class="given">${Y(costA)}</td><td>10年</td><td class="given">${Y(accA)}</td><td class="given">${Y(costA-accA)}</td><td>${inputHtml('aDep')}</td></tr><tr><td>備品B</td><td class="given">${Y(costB)}</td><td>6年</td><td>${inputHtml('bAcc')}</td><td>${inputHtml('bBook')}</td><td class="given">${Y(depB)}</td></tr><tr><td>備品C</td><td class="given">${Y(costC)}</td><td>4年</td><td class="given">—</td><td class="given">—</td><td>${inputHtml('cDep')}</td></tr><tr><th>小計</th><th class="given">${Y(totalCost)}</th><th></th><th>${inputHtml('totalAcc')}</th><th>${inputHtml('totalBook')}</th><th>${inputHtml('totalDep')}</th></tr></table></div></section>`+theoryHtml()}
function makeAccrual(){const monthly=pick([90000,100000,120000]),paid1=monthly*6,newMonthly=Math.round(monthly*1.1),paid2=newMonthly*6,prepaid=newMonthly*4,expense=monthly*6+newMonthly*2,opening=pick([300000,400000,500000]);state={mode:'accrual',ans:{a:'前期繰越',b:'前期繰越',c:'次期繰越',n1:opening,n2:expense,n3:prepaid},explain:`2月1日に6か月分を前払いしたため、3月末時点で4か月分が翌期分です。前払家賃は ${Y(newMonthly)}×4＝${Y(prepaid)}円。当期費用は旧家賃6か月＋新家賃2か月＝${Y(expense)}円。`};const opts=['前期繰越','次期繰越','普通預金','支払家賃','前払家賃','未払家賃','前受家賃','損益'];return `<div class="section">第2問（1）経過勘定・家賃</div><section class="card"><p>家賃は6か月分を前払いします。8月1日に月額 <b>${Y(monthly)}円</b> で6か月分を支払い、2月1日から家賃が10%値上げとなり、同日に6か月分 <b>${Y(paid2)}円</b> を支払いました。期首には前払家賃 <b>${Y(opening)}円</b> があります。</p><div class="wrap"><table class="tbl"><tr><th colspan="3">前払家賃</th><th colspan="3">支払家賃</th></tr><tr><th>日付</th><th>摘要</th><th>金額</th><th>日付</th><th>摘要</th><th>金額</th></tr><tr><td>4/1</td><td>${selectHtml('a',opts)}</td><td>${inputHtml('n1')}</td><td>8/1</td><td class="given">普通預金</td><td class="given">${Y(paid1)}</td></tr><tr><td>3/31</td><td class="given">支払家賃</td><td>${inputHtml('n3')}</td><td>2/1</td><td class="given">普通預金</td><td class="given">${Y(paid2)}</td></tr><tr><td>4/1</td><td>${selectHtml('b',opts)}</td><td class="given">${Y(prepaid)}</td><td>3/31</td><td>${selectHtml('c',opts)}</td><td>${inputHtml('n2')}</td></tr></table></div></section>`+theoryHtml()}
const builders={closing:makeClosing,dividend:makeDividend,asset:makeAsset,accrual:makeAccrual};function chosen(){return currentMode==='random'?pick(Object.keys(builders)):currentMode}function make(){problem.innerHTML=builders[chosen()]();result.classList.remove('show');document.querySelectorAll('.answer').forEach(x=>x.classList.remove('ok','ng'));window.scrollTo(0,0)}
function answerValue(el){return el.dataset.type==='num'?Number((el.value||'').replace(/,/g,'')):el.value}function gradeAll(){let total=0,correct=0;document.querySelectorAll('[data-key]').forEach(el=>{total++;const ok=answerValue(el)===state.ans[el.dataset.key];el.classList.toggle('ok',ok);el.classList.toggle('ng',!ok);if(ok)correct++});document.querySelectorAll('[data-theory]').forEach(el=>{total++;const ok=el.value===state.theory[+el.dataset.theory].a;el.classList.toggle('ok',ok);el.classList.toggle('ng',!ok);if(ok)correct++});const rate=Math.round(correct/total*100);score.textContent=`${correct} / ${total}（${rate}%）`;summary.textContent=rate>=80?'かなり仕上がっています。摘要と金額をセットで安定させましょう。':'赤い欄だけ、取引→勘定→締切の順で確認して解き直しましょう。';explain.innerHTML=state.explain;let s;try{s=JSON.parse(localStorage.getItem('boki3_q2_cbt_v2')||'{}')}catch{s={}}s.answered=(s.answered||0)+total;s.correct=(s.correct||0)+correct;s.lastRate=rate;s.lastMode=state.mode;s.lastAt=Date.now();localStorage.setItem('boki3_q2_cbt_v2',JSON.stringify(s));result.classList.add('show');result.scrollIntoView({behavior:'smooth',block:'start'})}
modebar.innerHTML=MODES.map(([k,n])=>`<button data-mode="${k}" class="${k===currentMode?'active':''}">${n}</button>`).join('');modebar.onclick=e=>{const b=e.target.closest('button[data-mode]');if(!b)return;currentMode=b.dataset.mode;modebar.querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b));make()};grade.onclick=gradeAll;next.onclick=make;make();
</script></body></html>
