</style></head><body><div class="mock-wrap"><section id="intro"><div class="mock-hero"><h1>60分 本試験型模試</h1><p>普段のドリルとは別に、時間を区切って100点満点で現在の実戦力を測ります。</p></div><div class="mock-note"><b>この模試について</b><br>日本商工会議所の公式問題の転載ではありません。公式出題区分と公開サンプルの構成を参考に、本アプリ用に作成したオリジナル問題です。合格基準は公式の70%以上を基準に表示します。</div><label><b>受験する範囲</b><select id="year" class="mock-select"><option value="2026">2026年度（～2027/3/31）</option><option value="2027">2027年度（2027/4/1～）</option></select></label><button id="start" class="mock-start">▶ 60分模試を開始</button></section><section id="exam" hidden><div class="mock-top"><div class="mock-progress"><div><b id="ptext">1/32</b><div class="mock-bar"><i id="pbar" style="width:0"></i></div></div><div class="mock-time" id="timer">60:00</div></div></div><div class="mock-card"><span class="mock-tag" id="tag"></span><h2 id="title"></h2><div class="mock-body" id="body"></div><div class="mock-choices" id="choices"></div><div class="mock-actions"><button class="mock-prev" id="prev">← 前の問題</button><button class="mock-next" id="next">次の問題 →</button></div></div></section><section id="result" hidden></section></div><script>
const STORE='boki3_mock_results_v1',SCOPE='boki3_exam_scope_year_v1';let qs=[],idx=0,answers={},started=0,timerId=null;
const sh=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function Q(sec,pts,title,body,ans,opts){return{sec,pts,title,body,ans,opts}}
function journal(body,ans,w){return Q('q1',3,'正しい仕訳を選びなさい',body,ans,sh([ans,...w]))}
function build(year){const a=[];
a.push(journal('商品120,000円を掛けで販売した。','（借）売掛金 120,000 ／（貸）売上 120,000',['（借）売上 120,000 ／（貸）売掛金 120,000','（借）現金 120,000 ／（貸）売上 120,000','（借）売掛金 120,000 ／（貸）仕入 120,000']));
a.push(journal('商品85,000円を掛けで仕入れた。','（借）仕入 85,000 ／（貸）買掛金 85,000',['（借）買掛金 85,000 ／（貸）仕入 85,000','（借）仕入 85,000 ／（貸）未払金 85,000','（借）繰越商品 85,000 ／（貸）買掛金 85,000']));
a.push(journal('売掛金70,000円が普通預金口座へ振り込まれた。','（借）普通預金 70,000 ／（貸）売掛金 70,000',['（借）売掛金 70,000 ／（貸）普通預金 70,000','（借）普通預金 70,000 ／（貸）売上 70,000','（借）現金 70,000 ／（貸）売掛金 70,000']));
a.push(journal('備品180,000円を購入し、代金は翌月支払うこととした。','（借）備品 180,000 ／（貸）未払金 180,000',['（借）仕入 180,000 ／（貸）買掛金 180,000','（借）備品 180,000 ／（貸）買掛金 180,000','（借）未払金 180,000 ／（貸）備品 180,000']));
a.push(journal('出張に先立ち、従業員へ旅費概算額30,000円を現金で渡した。','（借）仮払金 30,000 ／（貸）現金 30,000',['（借）旅費交通費 30,000 ／（貸）現金 30,000','（借）現金 30,000 ／（貸）仮受金 30,000','（借）立替金 30,000 ／（貸）現金 30,000']));
a.push(journal('普通預金に25,000円の入金があったが内容は不明である。','（借）普通預金 25,000 ／（貸）仮受金 25,000',['（借）仮払金 25,000 ／（貸）普通預金 25,000','（借）普通預金 25,000 ／（貸）売上 25,000','（借）現金 25,000 ／（貸）仮受金 25,000']));
a.push(journal('給料総額240,000円から所得税12,000円、社会保険料36,000円を控除し、差額を普通預金から支払った。','（借）給料 240,000 ／（貸）所得税預り金 12,000、社会保険料預り金 36,000、普通預金 192,000',['（借）給料 192,000 ／（貸）普通預金 192,000','（借）給料 240,000 ／（貸）普通預金 240,000','（借）普通預金 192,000 ／（貸）給料 192,000']));
a.push(journal('会社負担分の社会保険料38,000円を計上し、未払いとした。','（借）法定福利費 38,000 ／（貸）未払金 38,000',['（借）給料 38,000 ／（貸）未払金 38,000','（借）未払金 38,000 ／（貸）法定福利費 38,000','（借）法定福利費 38,000 ／（貸）社会保険料預り金 38,000']));
a.push(journal('保険料のうち翌期分24,000円を決算整理で前払へ振り替える。','（借）前払保険料 24,000 ／（貸）保険料 24,000',['（借）保険料 24,000 ／（貸）前払保険料 24,000','（借）未払保険料 24,000 ／（貸）保険料 24,000','（借）前払金 24,000 ／（貸）現金 24,000']));
a.push(journal('当期分の未払利息6,000円を決算整理で計上する。','（借）支払利息 6,000 ／（貸）未払利息 6,000',['（借）未払利息 6,000 ／（貸）支払利息 6,000','（借）支払利息 6,000 ／（貸）現金 6,000','（借）前払利息 6,000 ／（貸）支払利息 6,000']));
a.push(journal('備品の当期減価償却費60,000円を間接法で計上する。','（借）減価償却費 60,000 ／（貸）備品減価償却累計額 60,000',['（借）備品減価償却累計額 60,000 ／（貸）減価償却費 60,000','（借）減価償却費 60,000 ／（貸）備品 60,000','（借）備品 60,000 ／（貸）減価償却費 60,000']));
a.push(journal('貸倒引当金の不足額4,000円を差額補充法で計上する。','（借）貸倒引当金繰入 4,000 ／（貸）貸倒引当金 4,000',['（借）貸倒引当金 4,000 ／（貸）貸倒引当金繰入 4,000','（借）貸倒損失 4,000 ／（貸）売掛金 4,000','（借）売掛金 4,000 ／（貸）貸倒引当金 4,000']));
a.push(journal('商品100,000円（税抜）を掛けで販売した。消費税10%、税抜方式。','（借）売掛金 110,000 ／（貸）売上 100,000、仮受消費税 10,000',['（借）売掛金 100,000、仮払消費税 10,000 ／（貸）売上 110,000','（借）売掛金 110,000 ／（貸）売上 110,000','（借）売上 100,000、仮受消費税 10,000 ／（貸）売掛金 110,000']));
if(year==='2027'){
 a.push(journal('キャッシュレス決済で商品50,000円を販売し、決済手数料2,000円を差し引いた48,000円が後日入金される。','（借）クレジット売掛金 48,000、支払手数料 2,000 ／（貸）売上 50,000',['（借）普通預金 48,000、支払手数料 2,000 ／（貸）売上 50,000','（借）クレジット売掛金 50,000 ／（貸）売上 50,000','（借）売掛金 48,000 ／（貸）売上 48,000']));
 a.push(journal('取得原価400,000円、減価償却累計額240,000円の備品を廃棄した。処分価値はない。','（借）備品減価償却累計額 240,000、固定資産除却損 160,000 ／（貸）備品 400,000',['（借）減価償却費 160,000 ／（貸）備品 160,000','（借）備品減価償却累計額 400,000 ／（貸）備品 400,000','（借）備品 400,000 ／（貸）備品減価償却累計額 240,000、固定資産売却益 160,000']));
}else{
 a.push(journal('商品代金90,000円として約束手形を受け取った。','（借）受取手形 90,000 ／（貸）売上 90,000',['（借）売掛金 90,000 ／（貸）売上 90,000','（借）現金 90,000 ／（貸）受取手形 90,000','（借）売上 90,000 ／（貸）受取手形 90,000']));
 a.push(journal('買掛金75,000円を支払うため小切手を振り出した。','（借）買掛金 75,000 ／（貸）当座預金 75,000',['（借）仕入 75,000 ／（貸）支払手形 75,000','（借）買掛金 75,000 ／（貸）現金 75,000','（借）当座預金 75,000 ／（貸）買掛金 75,000']));
}
const q2=[
 ['売掛金を得意先別に管理する補助元帳は？','売掛金元帳',['売掛金元帳','買掛金元帳','売上帳','現金出納帳']],
 ['商品を仕入れるたびに平均単価を計算し直す方法は？','移動平均法',['移動平均法','先入先出法','定額法','個別法']],
 ['先に仕入れた商品から先に払い出すと仮定する方法は？','先入先出法',['先入先出法','移動平均法','定率法','総平均法']],
 ['現金の受入・支払を記録する帳簿は？','現金出納帳',['現金出納帳','当座預金出納帳','売上帳','商品有高帳']],
 ['小口現金係が日々の少額支出を記録する帳簿は？','小口現金出納帳',['小口現金出納帳','現金出納帳','仕入帳','固定資産台帳']],
 ['商品の売上取引を記録する補助記入帳は？','売上帳',['売上帳','仕入帳','売掛金元帳','総勘定元帳']],
 ['仕訳帳から各勘定へ記入することを何という？','転記',['転記','繰越','締切','決算整理']],
 ['各勘定の残高を一覧にして貸借を確認する表は？','試算表',['試算表','精算表','損益計算書','仕訳日計表']],
 ['現金の入金を伴う取引に用いる伝票は？','入金伝票',['入金伝票','出金伝票','振替伝票','仕入伝票']],
 ['資産・負債・純資産の残高を翌期へ引き継ぐ処理は？','次期繰越',['次期繰越','損益振替','売上振替','決算整理前へ戻す']]
];q2.forEach(x=>a.push(Q('q2',2,'第2問：帳簿・勘定',x[0],x[1],sh(x[2]))));
const cash=118000,allow=5000,cogs=470000,dep=60000,insurance=90000,vat=17000,profit=193000;
const base='決算整理前残高など：現金帳簿120,000円（実査118,000円。差額のうち通信費記帳漏れ1,200円、残り原因不明）、売掛金300,000円・貸倒引当金1,000円（2%設定）、期首商品50,000円・仕入500,000円・期末商品80,000円、備品480,000円（耐用8年・残存0）、保険料120,000円（翌期分30,000円）、給料200,000円（未払20,000円）、仮受消費税55,000円・仮払消費税38,000円、売上1,100,000円、通信費10,000円、法人税等50,000円。';
[[ '決算整理後の現金残高は？',cash],[ '貸倒引当金繰入額は？',allow],[ '売上原価は？',cogs],[ '当期減価償却費は？',dep],[ '決算整理後の保険料費用は？',insurance],[ '未払消費税は？',vat],[ '法人税等を含めた当期純利益は？',profit]].forEach(([t,n])=>{const d=Math.max(500,Math.round(n*.1/100)*100||1000),ops=sh([n,n+d,Math.max(0,n-d),Math.round(n*1.2)]).map(v=>Number(v).toLocaleString('ja-JP')+'円');a.push(Q('q3',5,'第3問：決算総合',base+'\n\n'+t,Number(n).toLocaleString('ja-JP')+'円',ops))});return a}
function start(){const year=document.getElementById('year').value;localStorage.setItem(SCOPE,year);qs=build(year);idx=0;answers={};started=Date.now();document.getElementById('intro').hidden=true;document.getElementById('exam').hidden=false;render();timerId=setInterval(tick,500)}
function tick(){const left=Math.max(0,3600-Math.floor((Date.now()-started)/1000));document.getElementById('timer').textContent=String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0');if(left===0){clearInterval(timerId);finish()}}
function render(){const q=qs[idx];document.getElementById('ptext').textContent=`${idx+1}/${qs.length}`;document.getElementById('pbar').style.width=((idx+1)/qs.length*100)+'%';document.getElementById('tag').textContent=q.sec==='q1'?'第1問 45点':q.sec==='q2'?'第2問 20点':'第3問 35点';document.getElementById('title').textContent=q.title;document.getElementById('body').textContent=q.body;document.getElementById('choices').innerHTML=q.opts.map(o=>`<button class="mock-choice ${answers[idx]===o?'sel':''}" type="button"></button>`).join('');[...document.querySelectorAll('.mock-choice')].forEach((b,i)=>{b.textContent=q.opts[i];b.onclick=()=>{answers[idx]=q.opts[i];render()}});document.getElementById('prev').disabled=idx===0;document.getElementById('next').textContent=idx===qs.length-1?'採点する':'次の問題 →'}
function finish(){clearInterval(timerId);let q1=0,q2=0,q3=0;qs.forEach((q,i)=>{if(answers[i]===q.ans){if(q.sec==='q1')q1+=q.pts;if(q.sec==='q2')q2+=q.pts;if(q.sec==='q3')q3+=q.pts}});const total=q1+q2+q3,year=localStorage.getItem(SCOPE)||'2026',sec=Math.min(3600,Math.floor((Date.now()-started)/1000));let xs=[];try{xs=JSON.parse(localStorage.getItem(STORE)||'[]')}catch(e){}xs.push({date:Date.now(),year,q1,q2,q3,total,seconds:sec});localStorage.setItem(STORE,JSON.stringify(xs.slice(-20)));document.getElementById('exam').hidden=true;const r=document.getElementById('result');r.hidden=false;r.innerHTML=`<div class="mock-result"><div class="mock-score">${total}点</div><span class="mock-pass ${total>=70?'ok':'ng'}">${total>=70?'70点以上：合格水準':'70点まであと'+(70-total)+'点'}</span><div class="mock-sections"><div>第1問<b>${q1}/45</b></div><div>第2問<b>${q2}/20</b></div><div>第3問<b>${q3}/35</b></div></div><p>${Math.floor(sec/60)}分${sec%60}秒。結果はトップの「CBT合格予想」に保存されました。</p><a class="home" href="index.html">トップで合格予想を見る</a><a class="again" href="mock.html">もう一度模試を受ける</a></div>`;scrollTo(0,0)}
document.getElementById('start').onclick=start;document.getElementById('prev').onclick=()=>{if(idx>0){idx--;render();scrollTo(0,0)}};document.getElementById('next').onclick=()=>{if(idx<qs.length-1){idx++;render();scrollTo(0,0)}else finish()};const saved=localStorage.getItem(SCOPE);if(saved)document.getElementById('year').value=saved;
</script></body></html>
