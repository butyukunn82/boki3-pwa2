<!doctype html><html lang="ja"><head><script>document.documentElement.classList.add('js')</script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="common.css"><link rel="stylesheet" href="app-v20.css"><title>内部教材管理</title><style>.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.metric{padding:14px;border:1px solid var(--u-line);border-radius:14px;background:var(--u-card)}.metric b{font-size:1.45rem}.audit-table{width:100%;border-collapse:collapse;font-size:.84rem}.audit-table th,.audit-table td{border-bottom:1px solid var(--u-line);padding:8px 5px;text-align:left}.yes{font-weight:900}.no{opacity:.35}@media(max-width:650px){.metrics{grid-template-columns:1fr}.audit-table{font-size:.75rem}}</style><link rel="stylesheet" href="ux-v23.css"></head><body class="app-v20"><div class="u-app"><header class="u-top"><div><div class="u-brand">内部教材管理</div><div class="u-small">2026年度・2022年度適用区分表を基準</div></div><span class="u-small">通常画面には表示しません</span></header><main class="u-page"><div class="u-note"><b>重要：</b>44は公式が定めた「論点数」ではありません。公式区分表をこのアプリで監査しやすい学習単位へ分解した数です。「44/44」は照合作業の完了を示し、「完全網羅100%」を意味しません。</div><div class="metrics" style="margin-top:12px"><div class="metric"><small>公式論点照合</small><br><b id="mVerified">—</b></div><div class="metric"><small>教材充実度</small><br><b id="mMaterial">—</b></div><div class="metric"><small>あなたの習熟度</small><br><b id="mSkill">—</b></div></div><div class="u-card" style="margin-top:12px"><h2>論点マスター</h2><div style="overflow:auto"><table class="audit-table"><thead><tr><th>ID</th><th>監査単位</th><th>主な出題</th><th>理解</th><th>反復</th><th>CBT</th><th>実戦</th></tr></thead><tbody id="rows"></tbody></table></div></div></main></div><script src="scope-master.js"></script><script>const m=BOKI_SCOPE_METRICS();mVerified.textContent=`${m.verified} / ${m.totalUnits} ✓`;mMaterial.textContent=m.material+'%';function safe(k){try{return JSON.parse(localStorage.getItem(k)||'null')}catch{return null}}const q1=safe('boki3_q1_trainer_v1')||{};const q2=safe('boki3trainer_v2')||{};const q3=safe('boki3_q3_trainer_v1')||{};const cbt=q1.cbt||{};let a=0,c=0;[q1,q2,q3].forEach(x=>{a+=x.answered||0;c+=x.correct||0});mSkill.textContent=cbt.answered?Math.round(cbt.correct/cbt.answered*100)+'% CBT':(a?Math.round(c/a*100)+'% 学習':'未測定');rows.innerHTML=BOKI_SCOPE_UNITS.map(x=>`<tr><td>${x.id}</td><td>${x.name}</td><td>${x.exam}</td>${['understand','drill','cbt','exam'].map(k=>`<td class="${x.coverage[k]?'yes':'no'}">${x.coverage[k]?'✓':'—'}</td>`).join('')}</tr>`).join('');</script><script src="unified.js"></script></body></html>
