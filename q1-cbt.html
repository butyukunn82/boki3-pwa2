</style></head><body><div class="wrap"><section id="intro"><div class="hero"><h1>第1問 CBT完全入力</h1><p>選択肢から答えを見る練習ではなく、借方・貸方の科目と金額を自分で組み立てます。</p></div><div class="note"><b>採点ルール：</b>この練習では、1問3点。借方・貸方・勘定科目・金額がすべて一致したときだけ正解にします。途中一致は得点にしませんが、弱点診断には残します。</div><button class="start" id="start">▶ 15問・45点を始める</button><div class="actions"><a class="back" href="q1.html">← 第1問メニュー</a><a class="back" href="index.html">ホーム</a></div></section><section id="quiz" hidden><div class="head"><div><b id="progress">1/15</b><div class="bar"><i id="pbar"></i></div></div><span class="timer" id="timer">00:00</span></div><div class="card" id="card"></div></section><section id="done" hidden></section></div><script src="mastery.js"></script><script src="error-diagnostics-v1.js"></script><script>
'use strict';
const STORE='boki3_q1_cbt_v1';
const ACC=['現金','小口現金','普通預金','当座預金','売掛金','買掛金','仕入','売上','備品','建物','未払金','未収入金','仮払金','仮受金','前払保険料','保険料','支払利息','未払利息','減価償却費','備品減価償却累計額','貸倒引当金繰入','貸倒引当金','貸倒損失','償却債権取立益','クレジット売掛金','支払手数料','給料','所得税預り金','社会保険料預り金','法定福利費','受取商品券','資本金','繰越利益剰余金','未払配当金','利益準備金','修繕費','法人税、住民税及び事業税','仮払法人税等','未払法人税等','消耗品費','通信費','租税公課','前払費用','前受収益','未収収益','未払費用'];
const Q=[
{id:'sale-credit',topic:'掛売上',text:'商品120,000円を掛けで販売した。',d:[['売掛金',120000]],c:[['売上',120000]],pool:['売掛金','売上','現金','買掛金','仕入'],exp:'掛けで売ったので、代金を受け取る権利＝売掛金が増え、売上が発生します。'},
{id:'buy-credit',topic:'掛仕入',text:'商品85,000円を掛けで仕入れた。',d:[['仕入',85000]],c:[['買掛金',85000]],pool:['仕入','買掛金','売上','売掛金','未払金'],exp:'商品仕入の未払いは買掛金です。'},
{id:'equipment-payable',topic:'固定資産取得',text:'備品180,000円を購入し、代金は翌月支払うこととした。',d:[['備品',180000]],c:[['未払金',180000]],pool:['備品','未払金','仕入','買掛金','普通預金'],exp:'商品以外の後払いなので、貸方は買掛金ではなく未払金です。'},
{id:'cashless',topic:'クレジット売掛金',text:'商品100,000円をクレジット決済で販売し、決済手数料3,000円を販売時に計上する。',d:[['クレジット売掛金',97000],['支払手数料',3000]],c:[['売上',100000]],pool:['クレジット売掛金','支払手数料','売上','売掛金','普通預金'],exp:'売上総額100,000円を貸方。手数料を費用、残額を決済会社への債権として処理します。'},
{id:'payroll',topic:'給与',text:'給料240,000円から所得税12,000円、社会保険料36,000円を控除し、差額を普通預金から支払った。',d:[['給料',240000]],c:[['所得税預り金',12000],['社会保険料預り金',36000],['普通預金',192000]],pool:['給料','所得税預り金','社会保険料預り金','普通預金','法定福利費','未払金'],exp:'借方は総支給額。天引き分は会社が一時的に預かる負債、残額が手取支払です。'},
{id:'legal-welfare',topic:'社会保険料',text:'会社負担分の社会保険料38,000円を計上し、未払いとした。',d:[['法定福利費',38000]],c:[['未払金',38000]],pool:['法定福利費','未払金','給料','社会保険料預り金','普通預金'],exp:'会社自身の負担分は法定福利費。従業員から預かった社会保険料預り金とは別です。'},
{id:'depreciation',topic:'減価償却',text:'備品の当期減価償却費60,000円を間接法で計上する。',d:[['減価償却費',60000]],c:[['備品減価償却累計額',60000]],pool:['減価償却費','備品減価償却累計額','備品','貸倒引当金','修繕費'],exp:'間接法では固定資産本体を減らさず、減価償却累計額を貸方に計上します。'},
{id:'accrued-interest',topic:'経過勘定',text:'当期分の未払利息6,000円を決算整理で計上する。',d:[['支払利息',6000]],c:[['未払利息',6000]],pool:['支払利息','未払利息','前払費用','普通預金','未払金'],exp:'当期の費用を追加し、まだ払っていない義務を未払利息として計上します。'},
{id:'prepaid-insurance',topic:'経過勘定',text:'支払済み保険料のうち、翌期分24,000円を決算整理で繰り延べる。',d:[['前払保険料',24000]],c:[['保険料',24000]],pool:['前払保険料','保険料','未払費用','普通預金','前受収益'],exp:'翌期分を当期費用から取り除き、資産の前払保険料へ振り替えます。'},
{id:'gift',topic:'受取商品券',text:'商品30,000円を販売し、代金として他社等が発行した商品券を受け取った。',d:[['受取商品券',30000]],c:[['売上',30000]],pool:['受取商品券','売上','現金','売掛金','仕入'],exp:'後日精算できる商品券は受取商品券という資産です。'},
{id:'bad-debt-recovery',topic:'償却債権取立益',text:'前期に貸倒れとして処理済みの売掛金40,000円を当期に普通預金で回収した。',d:[['普通預金',40000]],c:[['償却債権取立益',40000]],pool:['普通預金','償却債権取立益','売掛金','貸倒引当金','貸倒損失'],exp:'前期にすでに債権を帳簿から消しているため、当期の回収は償却債権取立益として処理します。'},
{id:'petty-cash-imprest',topic:'小口現金',text:'定額資金前渡制度を採用している。小口現金係へ100,000円を普通預金から前渡しした。',d:[['小口現金',100000]],c:[['普通預金',100000]],pool:['小口現金','普通預金','現金','仮払金','前払金','立替金'],exp:'小口現金係へ一定額を前渡しした時点では、小口現金という資産が増え、普通預金が減ります。'},
{id:'dividend',topic:'配当・利益準備金',text:'株主総会で、繰越利益剰余金を財源に配当350,000円と利益準備金35,000円の積立てを決議した。',d:[['繰越利益剰余金',385000]],c:[['未払配当金',350000],['利益準備金',35000]],pool:['繰越利益剰余金','未払配当金','利益準備金','資本金','普通預金','売上'],exp:'決議時点では配当をまだ支払っていないため未払配当金。利益準備金も同時に積み立てます。'},
{id:'corporate-tax',topic:'法人税等',text:'決算で法人税、住民税及び事業税300,000円を計上する。中間納付120,000円は仮払法人税等で処理済みである。',d:[['法人税、住民税及び事業税',300000]],c:[['仮払法人税等',120000],['未払法人税等',180000]],pool:['法人税、住民税及び事業税','仮払法人税等','未払法人税等','租税公課','普通預金','未払金'],exp:'当期税額を費用計上し、すでに仮払いした額を消して、残額を未払法人税等にします。'},
{id:'correction',topic:'訂正仕訳',text:'消耗品費5,000円を誤って通信費として現金払いの仕訳をしていた。訂正仕訳を行う。',d:[['消耗品費',5000]],c:[['通信費',5000]],pool:['消耗品費','通信費','現金','普通預金','修繕費'],exp:'現金の処理は正しいので現金は訂正仕訳に出ません。誤った費用を減らし、正しい費用へ振り替えます。'}
];
let list=[],idx=0,score=0,started=0,qStarted=0,timerId=null,answered=false;
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function opts(q){return [...new Set(['',...q.pool,...q.d.map(x=>x[0]),...q.c.map(x=>x[0]),...shuffle(ACC).slice(0,3)])]}
function row(side,i,pool){return `<div class="row"><select data-side="${side}" data-i="${i}">${pool.map(a=>`<option value="${esc(a)}">${a?esc(a):'— 科目 —'}</option>`).join('')}</select><input data-side="${side}" data-i="${i}" inputmode="numeric" pattern="[0-9]*" placeholder="金額"></div>`}
function collect(side,n){const arr=[];for(let i=0;i<n;i++){const s=document.querySelector(`select[data-side="${side}"][data-i="${i}"]`),v=document.querySelector(`input[data-side="${side}"][data-i="${i}"]`);arr.push([s?.value||'',Number(String(v?.value||'').replace(/,/g,''))||0])}return arr}
function norm(a){return a.map(([k,v])=>`${k}|${Number(v)}`).sort()}
function same(a,b){const x=norm(a),y=norm(b);return x.length===y.length&&x.every((v,i)=>v===y[i])}
function accountsSame(a,b){return a.map(x=>x[0]).filter(Boolean).sort().join('|')===b.map(x=>x[0]).filter(Boolean).sort().join('|')}
function amountsForCorrectSide(input,correct){return correct.every(([acc,amt])=>input.some(([a,v])=>a===acc&&v===amt))}
function saveResult(total){let d={sessions:[],answered:0,correct:0};try{d=JSON.parse(localStorage.getItem(STORE)||'null')||d}catch(e){}d.sessions||=[];d.answered=(d.answered||0)+15;d.correct=(d.correct||0)+score;d.lastScore=total;d.lastAt=Date.now();d.sessions.push({ts:Date.now(),score:total,correct:score,seconds:Math.floor((Date.now()-started)/1000)});d.sessions=d.sessions.slice(-20);localStorage.setItem(STORE,JSON.stringify(d))}
function start(){list=shuffle(Q);idx=0;score=0;started=Date.now();document.getElementById('intro').hidden=true;document.getElementById('quiz').hidden=false;render();timerId=setInterval(()=>{const s=Math.floor((Date.now()-started)/1000);document.getElementById('timer').textContent=`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`},500)}
function render(){const q=list[idx],pool=opts(q);answered=false;qStarted=Date.now();document.getElementById('progress').textContent=`${idx+1}/15`;document.getElementById('pbar').style.width=`${(idx+1)/15*100}%`;document.getElementById('card').innerHTML=`<span class="tag">${esc(q.topic)}</span><div class="qtext">${esc(q.text)}</div><div class="journal"><div class="side"><h3>借方</h3>${q.d.map((_,i)=>row('d',i,pool)).join('')}</div><div class="side"><h3>貸方</h3>${q.c.map((_,i)=>row('c',i,pool)).join('')}</div></div><button id="judge" class="judge">完全解答で判定</button><div id="feedback" class="feedback"></div><div id="actions" class="actions" style="display:none"><a class="back" href="q1.html">終了</a><button class="next" id="next">${idx===14?'結果を見る':'次の問題 →'}</button></div>`;document.getElementById('judge').onclick=judge}
function judge(){if(answered)return;answered=true;const q=list[idx],d=collect('d',q.d.length),c=collect('c',q.c.length),ok=same(d,q.d)&&same(c,q.c);if(ok){score++}const correctAccounts=[...q.d,...q.c].map(x=>x[0]).sort(),inputAccounts=[...d,...c].map(x=>x[0]).filter(Boolean).sort(),accountOk=correctAccounts.join('|')===inputAccounts.join('|'),sideOk=accountsSame(d,q.d)&&accountsSame(c,q.c),amountOk=amountsForCorrectSide(d,q.d)&&amountsForCorrectSide(c,q.c),tags=[];if(!accountOk)tags.push('科目選択');if(accountOk&&!sideOk)tags.push('借方・貸方');if(sideOk&&!amountOk)tags.push('金額');if((q.d.length+q.c.length)>2&&!ok)tags.push('複合仕訳');const sec=(Date.now()-qStarted)/1000;try{window.BOKI_MASTERY?.record?.('q1',`CBT1:${q.id}`,ok,sec,false,{topic:q.topic,skill:'CBT完全入力'})}catch(e){};const D=window.BOKI_DIAGNOSTICS;D?.record?.({module:'q1',topic:q.topic,questionId:q.id,stepId:'account',stepLabel:'勘定科目を選ぶ',ok:accountOk,tags:accountOk?[]:['科目選択']});D?.record?.({module:'q1',topic:q.topic,questionId:q.id,stepId:'side',stepLabel:'借方・貸方を決める',ok:sideOk,tags:sideOk?[]:['借方・貸方']});D?.record?.({module:'q1',topic:q.topic,questionId:q.id,stepId:'amount',stepLabel:'金額を合わせる',ok:amountOk,tags:amountOk?[]:['金額']});if((q.d.length+q.c.length)>2)D?.record?.({module:'q1',topic:q.topic,questionId:q.id,stepId:'multi',stepLabel:'複合仕訳を完成',ok,tags:ok?[]:['複合仕訳']});document.querySelectorAll('select,input').forEach(x=>x.disabled=true);document.getElementById('judge').disabled=true;const f=document.getElementById('feedback');f.className='feedback show';const ans=`借方：${q.d.map(x=>`${x[0]} ${x[1].toLocaleString()}円`).join(' ／ ')}<br>貸方：${q.c.map(x=>`${x[0]} ${x[1].toLocaleString()}円`).join(' ／ ')}`;f.innerHTML=`<div class="result ${ok?'ok':'ng'}">${ok?'○ 3点・完全正解':'× 0点・完全解答には未到達'}</div><div class="diag"><span>科目<b>${accountOk?'○':'×'}</b></span><span>借貸<b>${sideOk?'○':'×'}</b></span><span>金額<b>${amountOk?'○':'×'}</b></span></div><div class="explain"><b>正解</b><br>${ans}<br><br>${esc(q.exp)}${tags.length?`<br><br><b>今回の弱点タグ：</b>${tags.join('・')}`:''}</div>`;const a=document.getElementById('actions');a.style.display='grid';document.getElementById('next').onclick=()=>{if(idx===14)finish();else{idx++;render();scrollTo(0,0)}}}
function finish(){clearInterval(timerId);const pts=score*3;saveResult(pts);document.getElementById('quiz').hidden=true;const D=window.BOKI_DIAGNOSTICS?.summary?.(),weak=D?.weakTags?.slice(0,3)||[];const sec=Math.floor((Date.now()-started)/1000);document.getElementById('done').hidden=false;document.getElementById('done').innerHTML=`<div class="finish"><div class="score">${pts}/45点</div><h2>第1問 CBT完全入力</h2><div class="finish-grid"><div>完全正解<b>${score}/15</b></div><div>正答率<b>${Math.round(score/15*100)}%</b></div><div>時間<b>${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')}</b></div></div>${weak.length?`<div class="note"><b>診断上の弱点：</b>${weak.map(x=>`${x.tag} ${x.ng}回`).join('／')}</div>`:''}<div class="actions"><a class="next" href="q1-cbt.html">もう一度</a><a class="back" href="q1.html">第1問メニューへ</a></div></div>`;window.dispatchEvent(new CustomEvent('boki-cbt-q1-finished',{detail:{score:pts,correct:score}}))}
document.getElementById('start').onclick=start;
</script></body></html>
