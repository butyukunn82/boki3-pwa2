<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="common.css"><title>学習管理｜日商簿記3級</title><link rel="stylesheet" href="mobile-app.css"><link rel="stylesheet" href="app-ui-v13.css">
<link rel="stylesheet" href="app-v20.css">
</head><body class="unified-shell app-v13 app-v20"><div class="u-app"><header class="u-top"><div class="u-brand">学習管理</div><a href="index.html" style="text-decoration:none">⌂ ホーム</a></header><main class="u-page"><section class="u-hero"><h1>学習状況を詳しく分析</h1><p>本人・指導者のどちらでも、どの段階でつまずいているかを確認できます。</p></section><div class="u-stats"><div class="u-stat"><strong id="total">0</strong><span>総回答</span></div><div class="u-stat"><strong id="acc">-</strong><span>正答率</span></div><div class="u-stat"><strong id="week">0</strong><span>直近7日</span></div><div class="u-stat"><strong id="streak">0日</strong><span>連続学習</span></div></div>
<div class="u-section-head"><h2>大問別</h2><span>カードをタップして学習へ</span></div><div id="modules" class="u-grid"></div>
<div class="u-section-head"><h2>理解の階段</h2><span>どこで止まっているかを見る</span></div><div class="u-card"><div class="u-note">統合版では「5要素 → 借方・貸方 → 仕訳 → 帳簿 → 決算整理 → 精算表」の順で弱点を追います。</div><div id="ladder" style="margin-top:10px"></div></div>
<div class="u-section-head"><h2>直近7日</h2><span>学習量と正答率</span></div><div class="u-card" id="days"></div>
<div class="u-section-head" id="review"><h2>次にやること</h2><span>弱点からおすすめ</span></div><div class="u-card" id="advice"></div></main></div><nav class="u-nav"><div class="u-nav-inner"><a href="index.html"><b>⌂</b>ホーム</a><a href="learn.html"><b>▣</b>学習メニュー</a><a href="management.html#review"><b>↻</b>復習</a><a href="settings.html"><b>•••</b>その他</a></div></nav><script src="unified.js"></script><script>
function safe(k){try{return JSON.parse(localStorage.getItem(k)||'null')||{}}catch{return {}}}const data=[{name:'第1問',d:safe('boki3_q1_trainer_v1'),href:'q1.html'},{name:'第2問',d:safe('boki3trainer_v2'),href:'q2.html'},{name:'第3問',d:safe('boki3_q3_trainer_v1'),href:'q3.html'}];let total=0,correct=0;data.forEach(x=>{total+=x.d.answered||0;correct+=x.d.correct||0});document.getElementById('total').textContent=total;document.getElementById('acc').textContent=total?Math.round(correct/total*100)+'%':'-';
const modules=document.getElementById('modules');modules.innerHTML=data.map(x=>{const a=x.d.answered||0,c=x.d.correct||0,p=a?Math.round(c/a*100):0;const icon=x.name==='第1問'?'✏️':x.name==='第2問'?'📒':'📊';return `<a class="u-card u-card--tap" href="${x.href}"><div class="u-icon">${icon}</div><div class="u-card-copy"><b>${x.name}</b><span>${a}回答・正答率 ${a?p+'%':'未学習'}</span><div class="u-progress" style="margin-top:8px"><i style="width:${p}%"></i></div></div><div class="u-card-arrow">›</div></a>`}).join('');
const histories=data.map(x=>x.d.history||{});let week=0;const dayRows=[];for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);const k=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;let a=0,c=0;histories.forEach(h=>{a+=h[k]?.answered||0;c+=h[k]?.correct||0});week+=a;dayRows.push(`<div class="u-flex" style="justify-content:space-between;border-bottom:1px solid var(--u-line);padding:8px 0"><span>${k.slice(5)}</span><b>${a}問 ${a?'・'+Math.round(c/a*100)+'%':''}</b></div>`)}document.getElementById('week').textContent=week;document.getElementById('days').innerHTML=dayRows.join('');
const daySet=new Set();histories.forEach(h=>Object.entries(h).forEach(([k,v])=>{if((v.answered||0)>0)daySet.add(k)}));let streak=0;for(let i=0;i<365;i++){const d=new Date();d.setDate(d.getDate()-i);const k=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;if(daySet.has(k))streak++;else if(i===0)continue;else break}document.getElementById('streak').textContent=streak+'日';
const q1=data[0].d;const q3=data[2].d;const stages=[['5要素',q1.bySkill?.['5要素']],['借方・貸方',q1.bySkill?.['借貸']],['仕訳',q1.bySkill?.['仕訳']],['帳簿',data[1].d.byCat?{seen:data[1].d.answered||0,correct:data[1].d.correct||0}:null],['決算整理',q3.bySkill?.['仕訳']],['精算表',q3.bySkill?.['ミニ表']||q3.bySkill?.['総合']]];document.getElementById('ladder').innerHTML=stages.map(([n,v])=>{const a=v?.seen||0,p=a?Math.round((v.correct||0)/a*100):0;return `<div style="margin:10px 0"><div class="u-flex" style="justify-content:space-between"><b>${n}</b><span>${a?p+'%':'未学習'}</span></div><div class="u-progress"><i style="width:${p}%"></i></div></div>`}).join('');
let weak=stages.filter(x=>x[1]?.seen).map(([n,v])=>({n,p:Math.round((v.correct||0)/(v.seen||1)*100)})).sort((a,b)=>a.p-b.p)[0];document.getElementById('advice').innerHTML=weak?`<b>今の優先：</b>「${weak.n}」が ${weak.p}% です。<div class="u-actions"><a class="u-btn u-primary" href="${weak.n==='5要素'||weak.n==='借方・貸方'||weak.n==='仕訳'?'q1.html':weak.n==='帳簿'?'q2.html':'q3.html'}" style="text-decoration:none;text-align:center">この分野を学ぶ</a></div>`:'まだ十分な履歴がありません。まず第1問の5要素分類を10問だけ解いてみましょう。';
</script></body></html>
