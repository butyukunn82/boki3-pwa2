<!doctype html><html lang="ja"><head><script>document.documentElement.classList.add('js')</script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="common.css"><link rel="stylesheet" href="mobile-app.css"><link rel="stylesheet" href="app-ui-v13.css"><link rel="stylesheet" href="app-v20.css"><link rel="stylesheet" href="ux-v23.css"><title>学習記録｜日商簿記3級</title></head>
<body class="unified-shell app-v13 app-v20"><div class="u-app"><header class="u-top"><div class="u-brand">学習記録</div><a href="index.html" style="text-decoration:none">⌂ ホーム</a></header><main class="u-page">
<section class="v23-hero"><div><h1>できるようになったことを確認</h1><p>数字は少なく、次に何をやるかが分かる形にまとめます。</p></div><img src="assets/mascot.png" alt="応援キャラクター"></section>
<div class="v23-stats"><div class="v23-stat"><b id="practiceRate">—</b><small>練習正答率</small></div><div class="v23-stat"><b id="examRate">—</b><small>本番形式</small></div><div class="v23-stat"><b id="streak">0日</b><small>連続学習</small></div></div>
<div class="v23-section" id="review">ここを復習</div><div class="v23-weak"><b id="weakTitle">まだ十分な履歴がありません</b><p id="weakText" style="margin:5px 0 10px;font-size:.84rem">まず10問だけ解いてみましょう。</p><a id="weakBtn" class="u-btn u-primary" href="q1.html" style="text-decoration:none;text-align:center">この分野を練習する</a></div>
<div class="v23-section">大問別</div><div id="modules" class="v23-list"></div>
<div class="v23-section">直近7日</div><div class="u-card"><div class="v23-rate-row"><span>回答数</span><b id="weekCount">0問</b></div><div class="v23-rate-row"><span>正答率</span><b id="weekRate">—</b></div><div id="days" style="margin-top:8px"></div></div>
<div class="v23-note">「本番形式」は現在、第1問の勘定科目選択＋金額入力の結果です。第2問・第3問の本格入力形式と60分模試を追加した後、同じ指標へ統合します。</div>
</main></div><nav class="u-nav"><div class="u-nav-inner"><a href="index.html"><b>⌂</b>ホーム</a><a href="learn.html"><b>▣</b>学ぶ</a><a href="management.html#review"><b>↻</b>復習</a><a class="active" href="management.html"><b>▥</b>記録</a></div></nav><script src="stats.js"></script><script src="unified.js"></script><script>
(function(){const s=BOKI_STATS.get();practiceRate.textContent=s.practice.rate==null?'—':s.practice.rate+'%';examRate.textContent=s.exam.rate==null?'未測定':s.exam.rate+'%';streak.textContent=s.streak+'日';weakTitle.textContent=s.weak.label;weakText.textContent=s.weak.detail;weakBtn.href=s.weak.href;modules.innerHTML=s.modules.map((x,i)=>`<a class="v23-card" href="${x.href}"><span class="v23-icon">${i+1}</span><span><b>${x.name}</b><small>${x.answered?`${x.answered}問・正答率 ${x.rate}%`:'まだ学習していません'}</small></span><span class="v23-arrow">›</span></a>`).join('');weekCount.textContent=s.week.answered+'問';weekRate.textContent=s.week.rate==null?'—':s.week.rate+'%';days.innerHTML=s.week.rows.map(r=>`<div class="v23-rate-row"><span>${r.key.slice(5)}</span><b>${r.answered}問${r.rate==null?'':'・'+r.rate+'%'}</b></div>`).join('')})()
</script></body></html>
