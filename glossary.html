<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="common.css"><title>勘定科目・用語辞典</title><style>.term{cursor:pointer}.term h3{margin:0 0 3px;color:var(--u-navy)}.drawer{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:50;padding:18px;align-items:center;justify-content:center}.drawer.show{display:flex}.drawer>div{background:var(--u-card);color:var(--u-text);max-width:620px;width:100%;max-height:86vh;overflow:auto;border-radius:16px;padding:16px}.route{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.route div{border:1px solid var(--u-line);border-radius:9px;padding:8px;text-align:center;font-size:.8rem}</style><link rel="stylesheet" href="mobile-app.css"><link rel="stylesheet" href="app-ui-v13.css">
<link rel="stylesheet" href="app-v20.css">
</head><body class="unified-shell app-v13 app-v20"><div class="u-app"><header class="u-top"><div class="u-brand">勘定科目・用語辞典</div><a href="index.html" style="text-decoration:none">⌂ ホーム</a></header><main class="u-page"><section class="u-hero"><h1>「意味」だけでなく「住所」を見る</h1><p>5要素、通常残高、P/L・B/S、繰越、特殊な役割まで一緒に確認します。</p></section><input id="search" placeholder="例：貸倒、前払、預り金" style="width:100%;padding:12px;border:1px solid var(--u-line);border-radius:11px;font-size:16px;background:var(--u-card);color:var(--u-text)"><div class="u-flex" style="margin:10px 0" id="filters"></div><div class="u-grid" id="list"></div></main></div><div class="drawer" id="drawer" onclick="if(event.target===this)this.classList.remove('show')"><div id="detail"></div></div><nav class="u-nav"><div class="u-nav-inner"><a href="index.html"><b>⌂</b>ホーム</a><a href="learn.html"><b>▣</b>学習メニュー</a><a href="management.html#review"><b>↻</b>復習</a><a href="settings.html"><b>•••</b>その他</a></div></nav><script src="unified.js"></script><script src="account-master.js"></script><script>
let filter='すべて';const els=['すべて','資産','負債','純資産','収益','費用','その他'];document.getElementById('filters').innerHTML=els.map(x=>`<button class="u-btn u-ghost" style="min-height:auto;padding:6px 9px" onclick="filter='${x}';render()">${x}</button>`).join('');document.getElementById('search').oninput=render;function render(){const s=document.getElementById('search').value.trim();const a=BOKI_ACCOUNTS.filter(x=>(filter==='すべて'||x.element===filter)&&(!s||x.name.includes(s)||(x.role||'').includes(s)||(x.pair||'').includes(s)));document.getElementById('list').innerHTML=a.map(x=>`<button class="u-card u-card--tap term" onclick="show('${x.name}')"><div class="u-icon">${x.element==='資産'?'A':x.element==='負債'?'L':x.element==='純資産'?'E':x.element==='収益'?'R':x.element==='費用'?'C':'＊'}</div><div class="u-card-copy"><h3>${x.name}</h3><span>${x.element}${x.role?' ・ '+x.role:''}</span></div><div class="u-card-arrow">›</div></button>`).join('')||'<div class="u-note">見つかりません。</div>'}function show(name){const x=findBokiAccount(name);document.getElementById('detail').innerHTML=`<div class="u-flex" style="justify-content:space-between"><div><span class="u-badge">${x.element}</span><h2>${x.name}</h2></div><button class="u-btn u-ghost" onclick="document.getElementById('drawer').classList.remove('show')">×</button></div>${x.role?`<div class="u-warn"><b>特殊な役割：</b>${x.role}</div>`:''}<p>${x.desc||`${x.name}は「${x.element}」に分類される勘定科目です。`}</p><div class="route"><div><b>5要素</b><br>${x.element}</div><div><b>増える側</b><br>${x.normalSide}</div><div><b>決算書</b><br>${x.statement}</div><div><b>翌期</b><br>${x.carry?'繰越す':'直接は繰越さない'}</div></div>${x.pair?`<div class="u-note" style="margin-top:12px"><b>相棒・関連：</b>${x.pair}</div>`:''}${x.aliases?.length?`<div class="u-small" style="margin-top:10px">許容・関連表記：${x.aliases.join('、')}</div>`:''}`;document.getElementById('drawer').classList.add('show')}render();
</script></body></html>
