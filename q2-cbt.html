<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#173b67"><title>第2問 本番形式</title><style>:root{--n:#173b67;--b:#2f6fad;--bg:#f4f7fb;--line:#cfdbe7;--good:#147a45;--bad:#b63434}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#243244;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI",Meiryo,sans-serif}.app{max-width:980px;margin:auto;padding-bottom:80px}.top{position:sticky;top:0;z-index:20;background:var(--n);color:#fff;padding:12px 14px;display:flex;justify-content:space-between;align-items:center}.top a{color:#fff;text-decoration:none}.page{padding:14px}.hero,.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:15px;margin-bottom:12px;box-shadow:0 7px 20px rgba(24,54,91,.06)}.hero{background:linear-gradient(135deg,#173b67,#3479b9);color:#fff}.hero h1{margin:0 0 4px;font-size:1.35rem}.hero p{margin:0;font-size:.83rem;opacity:.92}.note{font-size:.78rem;color:#65758a}.section{font-weight:900;color:var(--n);margin:18px 2px 8px}.ledger-wrap{overflow:auto}.ledger{border-collapse:collapse;width:100%;min-width:640px;font-size:.84rem}.ledger th,.ledger td{border:1px solid #9eb0c3;padding:7px;text-align:center}.ledger th{background:#eaf0f6}.ledger input,.ledger select,.theory select{width:100%;min-height:42px;border:2px solid var(--line);border-radius:8px;background:#fff;padding:7px;font-size:16px}.ledger input{text-align:right}.given{background:#f7f9fc}.theory{display:grid;gap:10px}.theory-q{border:1px solid #dde5ee;border-radius:12px;padding:11px;background:#fff}.theory-q b{display:block;margin-bottom:7px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:14px 0}.btn{min-height:50px;border:0;border-radius:12px;font-weight:900;font-size:.95rem}.primary{background:var(--n);color:#fff}.secondary{background:#e7edf4;color:#33465c}.result{display:none}.result.show{display:block}.score{font-size:1.7rem;font-weight:950;color:var(--n)}.ok{border-color:#69bd8e!important;background:#f0fbf5!important}.ng{border-color:#df8b8b!important;background:#fff2f2!important}.explain{margin-top:10px;padding:12px;border-radius:12px;background:#f7f9fc;font-size:.84rem;line-height:1.65}.footer{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);padding:8px;text-align:center}.footer a{display:inline-block;margin:0 9px;color:var(--n);font-weight:800;text-decoration:none;font-size:.82rem}@media(max-width:600px){.page{padding:10px}.actions{grid-template-columns:1fr}.hero h1{font-size:1.18rem}}</style></head><body><div class="app"><header class="top"><b>第2問　本番形式</b><a href="q2.html">第2問メニューへ</a></header><main class="page"><section class="hero"><h1>帳簿・勘定を直接埋める</h1><p>摘要は選択、金額は自力入力。第2問(1)＋第2問(2)を1セットで練習します。</p></section><div class="card"><b>この練習について</b><div class="note">公式サンプルの「勘定の空欄」「語句選択」の解答動作を参考にしたオリジナル問題です。公式問題の転載ではありません。</div></div><div class="section">第2問（1）勘定記入</div><section class="card"><div id="facts" class="note"></div><p><b>次の売上勘定・仕入勘定の空欄を完成させてください。</b></p><div class="ledger-wrap"><table class="ledger"><thead><tr><th colspan="3">売上</th><th colspan="3">仕入</th></tr><tr><th>日付</th><th>摘要</th><th>金額</th><th>日付</th><th>摘要</th><th>金額</th></tr></thead><tbody><tr><td>3/31</td><td><select data-k="salesCloseLabel"><option value="">選択</option></select></td><td><input data-k="salesTotal" inputmode="numeric" placeholder="数字のみ"></td><td>4/1</td><td><select data-k="openLabel"><option value="">選択</option></select></td><td><input data-k="openInv" inputmode="numeric"></td></tr><tr><td class="given">期中</td><td class="given">売掛金ほか</td><td class="given" id="salesGiven"></td><td>3/31</td><td><select data-k="closeLabel"><option value="">選択</option></select></td><td><input data-k="closeInv" inputmode="numeric"></td></tr><tr><td></td><td></td><td></td><td>3/31</td><td><select data-k="cogsLabel"><option value="">選択</option></select></td><td><input data-k="cogs" inputmode="numeric"></td></tr><tr><td></td><td></td><td></td><td class="given">期中</td><td class="given">買掛金ほか</td><td class="given" id="purchaseGiven"></td></tr></tbody></table></div></section><div class="section">第2問（2）語句選択</div><section class="card"><div id="theory" class="theory"></div></section><div class="actions"><button class="btn primary" id="grade">採点する</button><button class="btn secondary" id="next">別の問題</button></div><section class="card result" id="result"><div class="score" id="score"></div><div id="summary"></div><div class="explain" id="explain"></div></section></main></div><div class="footer"><a href="index.html">ホーム</a><a href="q2.html">第2問</a><a href="q3-cbt.html">第3問 本番形式</a></div><script>const YEN=n=>Number(n).toLocaleString('ja-JP');const labels=['前期繰越','次期繰越','売上','仕入','繰越商品','損益'];const bank=[{q:'当期中に発生した売掛金が貸倒れになった。直接処理に用いる費用勘定は？',a:'貸倒損失',o:['貸倒損失','貸倒引当金','償却債権取立益','雑損']},{q:'株主への配当に伴い、一定額まで積み立てる純資産の勘定は？',a:'利益準備金',o:['利益準備金','資本金','未払配当金','繰越利益剰余金']},{q:'法人税等を中間納付したときに用いる資産勘定は？',a:'仮払法人税等',o:['仮払法人税等','未払法人税等','法人税等','前払費用']},{q:'前期に貸倒処理した売掛金を当期に回収したときの収益勘定は？',a:'償却債権取立益',o:['償却債権取立益','受取利息','雑益','売上']},{q:'商品を掛けで販売したとき、相手から代金を受け取る権利を表す勘定は？',a:'売掛金',o:['売掛金','未収入金','前払金','仮払金']},{q:'商品以外の固定資産を売却し、代金を後日受け取る場合の債権は？',a:'未収入金',o:['未収入金','売掛金','受取手形','前受金']},{q:'未使用の郵便切手を決算で資産に振り替えるときに使う勘定は？',a:'貯蔵品',o:['貯蔵品','通信費','消耗品費','前払費用']},{q:'会社負担分の社会保険料を費用計上するときに使う勘定は？',a:'法定福利費',o:['法定福利費','福利厚生費','給料','預り金']}];let p;function pick(a){return a[Math.floor(Math.random()*a.length)]}function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function make(){const sales=[pick([800,900,1000,1100]),pick([700,850,950,1050]),pick([900,1000,1200,1300])].map(x=>x*1000);const purchases=[pick([500,600,700,800]),pick([650,750,850,950]),pick([700,900,1000,1100])].map(x=>x*1000);const openInv=pick([300,350,400,450])*1000;let closeInv=pick([220,260,300,340])*1000;if(closeInv===openInv)closeInv-=40000;const salesTotal=sales.reduce((a,b)=>a+b,0),purchaseTotal=purchases.reduce((a,b)=>a+b,0),cogs=openInv+purchaseTotal-closeInv;const theory=shuffle(bank).slice(0,4);p={sales,purchases,openInv,closeInv,salesTotal,purchaseTotal,cogs,theory,ans:{salesCloseLabel:'損益',salesTotal,openLabel:'繰越商品',openInv,closeLabel:'繰越商品',closeInv,cogsLabel:'損益',cogs}};render()}function fillSelect(el,opts){el.innerHTML='<option value="">選択</option>'+opts.map(x=>`<option>${x}</option>`).join('')}function render(){document.querySelectorAll('[data-k]').forEach(el=>{el.classList.remove('ok','ng');if(el.tagName==='SELECT'){fillSelect(el,labels)}else el.value=''});facts.innerHTML=`当期の商品売買は3分法。期首商品は <b>${YEN(p.openInv)}円</b>、期末商品は <b>${YEN(p.closeInv)}円</b>。期中の売上は ${p.sales.map(YEN).join('円、')}円、仕入は ${p.purchases.map(YEN).join('円、')}円です。売上原価は仕入勘定で算定します。`;salesGiven.textContent=YEN(p.salesTotal);purchaseGiven.textContent=YEN(p.purchaseTotal);theory.innerHTML=p.theory.map((x,i)=>`<div class="theory-q"><b>${i+1}. ${x.q}</b><select data-theory="${i}"><option value="">選択</option>${shuffle(x.o).map(v=>`<option>${v}</option>`).join('')}</select></div>`).join('');result.classList.remove('show');window.scrollTo(0,0)}function val(el){return el.tagName==='INPUT'?Number((el.value||'').replace(/,/g,'')):el.value}grade.onclick=()=>{let total=0,correct=0;document.querySelectorAll('[data-k]').forEach(el=>{total++;const k=el.dataset.k;const ok=val(el)===p.ans[k];el.classList.toggle('ok',ok);el.classList.toggle('ng',!ok);if(ok)correct++});document.querySelectorAll('[data-theory]').forEach(el=>{total++;const ok=el.value===p.theory[+el.dataset.theory].a;el.classList.toggle('ok',ok);el.classList.toggle('ng',!ok);if(ok)correct++});const rate=Math.round(correct/total*100);score.textContent=`${correct} / ${total}（${rate}%）`;summary.textContent=rate>=80?'かなり仕上がっています。金額入力まで安定させましょう。':'間違えた欄だけ、勘定の流れを確認してもう一度解いてみましょう。';explain.innerHTML=`売上は期末に損益へ <b>${YEN(p.salesTotal)}円</b> 振替。売上原価は「期首商品 ${YEN(p.openInv)} ＋ 当期仕入 ${YEN(p.purchaseTotal)} − 期末商品 ${YEN(p.closeInv)} ＝ <b>${YEN(p.cogs)}円</b>」。第2問では、摘要の意味と金額計算を別々に考えるのがポイントです。`;let s;try{s=JSON.parse(localStorage.getItem('boki3_q2_cbt_v1')||'{}')}catch{s={}}s.answered=(s.answered||0)+total;s.correct=(s.correct||0)+correct;s.lastRate=rate;s.lastAt=Date.now();localStorage.setItem('boki3_q2_cbt_v1',JSON.stringify(s));result.classList.add('show');result.scrollIntoView({behavior:'smooth',block:'start'})};next.onclick=make;make();</script></body></html>
