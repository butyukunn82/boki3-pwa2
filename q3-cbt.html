<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1d6a3b"><title>第3問 本番形式</title><style>
:root{--g:#1d6a3b;--g2:#3c9a5d;--bg:#f4f7f5;--line:#cbd9cf;--text:#25362b;--good:#147a45;--bad:#b63434}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI",Meiryo,sans-serif}.app{max-width:1120px;margin:auto;padding-bottom:82px}.top{position:sticky;top:0;z-index:20;background:var(--g);color:#fff;padding:12px 14px;display:flex;justify-content:space-between;align-items:center}.top a{color:#fff;text-decoration:none}.page{padding:14px}.hero,.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:15px;margin-bottom:12px;box-shadow:0 7px 20px rgba(31,83,48,.06)}.hero{background:linear-gradient(135deg,#1d6a3b,#46a868);color:#fff}.hero h1{margin:0 0 4px;font-size:1.35rem}.hero p{margin:0;font-size:.83rem;opacity:.94}.note{font-size:.78rem;color:#687a6e;line-height:1.65}.modebar{display:flex;gap:7px;overflow:auto;padding:2px 0 10px;scrollbar-width:none}.modebar button{white-space:nowrap;border:1px solid var(--line);background:#fff;color:#365b42;border-radius:999px;padding:8px 11px;font-weight:850}.modebar button.active{background:var(--g);color:#fff;border-color:var(--g)}.section{font-weight:900;color:var(--g);margin:18px 2px 8px}.wrap{overflow:auto}.tb,.fs,.ws{border-collapse:collapse;width:100%;min-width:650px;font-size:.81rem}.tb th,.tb td,.fs th,.fs td,.ws th,.ws td{border:1px solid #9fb5a6;padding:7px;text-align:center}.tb th,.fs th,.ws th{background:#e8f1eb}.num{text-align:right!important}.ans{width:100%;min-width:105px;min-height:40px;border:2px solid var(--line);border-radius:8px;text-align:right;padding:6px;font-size:16px;background:#fff}.given{background:#f7faf8}.adjust{margin:0;padding-left:1.4em;font-size:.86rem;line-height:1.75}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:14px 0}.btn{min-height:50px;border:0;border-radius:12px;font-weight:900;font-size:.95rem}.primary{background:var(--g);color:#fff}.secondary{background:#e4ece6;color:#34533d}.result{display:none}.result.show{display:block}.score{font-size:1.7rem;font-weight:950;color:var(--g)}.ok{border-color:#65b584!important;background:#f0fbf4!important}.ng{border-color:#df8b8b!important;background:#fff2f2!important}.explain{margin-top:10px;padding:12px;border-radius:12px;background:#f5f9f6;font-size:.84rem;line-height:1.7}.footer{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);padding:8px;text-align:center}.footer a{display:inline-block;margin:0 9px;color:var(--g);font-weight:800;text-decoration:none;font-size:.82rem}.tiny{font-size:.7rem;color:#6d7f72}@media(max-width:760px){.two{grid-template-columns:1fr}.page{padding:10px}.hero h1{font-size:1.18rem}}
</style></head><body><div class="app"><header class="top"><b>第3問　本番形式</b><a href="q3.html">第3問メニューへ</a></header><main class="page"><section class="hero"><h1>決算整理から答案表を完成</h1><p>整理後残高試算表・精算表・B/S/P/Lの3形式を切り替えて練習します。</p></section><section class="card"><div class="note">公式サンプルで確認できる複数の答案形式を参考にしたオリジナル問題です。公式問題の転載ではありません。採点は学習用の厳格判定です。</div></section><div class="modebar" id="modebar"></div><div id="common"></div><div id="answerArea"></div><div class="actions"><button class="btn primary" id="grade">採点する</button><button class="btn secondary" id="next">別の問題</button></div><section class="card result" id="result"><div class="score" id="score"></div><div id="summary"></div><div class="explain" id="explain"></div></section></main></div><div class="footer"><a href="index.html">ホーム</a><a href="q2-cbt.html">第2問 本番形式</a><a href="q3.html">第3問</a></div><script>
const Y=n=>Number(n).toLocaleString('ja-JP'),pick=a=>a[Math.floor(Math.random()*a.length)];let mode='random',p;const MODES=[['random','ランダム'],['adjusted','整理後残高試算表'],['worksheet','精算表'],['statements','B/S・P/L']];function I(k){return `<input class="ans" data-k="${k}" inputmode="numeric" placeholder="数字のみ">`}function empty(){return '<span class="tiny">—</span>'}
function scenario(){const endInv=pick([220000,250000,280000]),prepaid=pick([40000,60000,80000]);const sales=5500000,purchases=3200000,openInv=180000,salary=900000,rent=360000,utilities=180000,ar=600000,allowBefore=3000,building=3000000,accDepBefore=600000,ap=430000,cash=420000,capital=2000000,retained=307000;const cogs=openInv+purchases-endInv,gross=sales-cogs,allowance=Math.round(ar*.02),badDebt=allowance-allowBefore,dep=120000,rentExp=rent-prepaid,pretax=gross-salary-rentExp-utilities-badDebt-dep,tax=Math.round(pretax*.3),net=pretax-tax,accDep=accDepBefore+dep,retainedEnd=retained+net,assets=cash+ar-allowance+endInv+prepaid+building-accDep,liabEquity=ap+tax+capital+retainedEnd;p={endInv,prepaid,sales,purchases,openInv,salary,rent,utilities,ar,allowBefore,building,accDepBefore,ap,cash,capital,retained,cogs,gross,allowance,badDebt,dep,rentExp,pretax,tax,net,accDep,retainedEnd,assets,liabEquity};}
function commonHtml(){return `<div class="section">決算整理前残高試算表</div><section class="card wrap"><table class="tb"><tr><th>勘定科目</th><th>借方</th><th>貸方</th><th>勘定科目</th><th>借方</th><th>貸方</th></tr><tr><td>現金</td><td class="num">420,000</td><td></td><td>買掛金</td><td></td><td class="num">430,000</td></tr><tr><td>売掛金</td><td class="num">600,000</td><td></td><td>貸倒引当金</td><td></td><td class="num">3,000</td></tr><tr><td>繰越商品</td><td class="num">180,000</td><td></td><td>建物減価償却累計額</td><td></td><td class="num">600,000</td></tr><tr><td>建物</td><td class="num">3,000,000</td><td></td><td>資本金</td><td></td><td class="num">2,000,000</td></tr><tr><td>仕入</td><td class="num">3,200,000</td><td></td><td>繰越利益剰余金</td><td></td><td class="num">307,000</td></tr><tr><td>給料</td><td class="num">900,000</td><td></td><td>売上</td><td></td><td class="num">5,500,000</td></tr><tr><td>地代家賃</td><td class="num">360,000</td><td></td><td></td><td></td><td></td></tr><tr><td>水道光熱費</td><td class="num">180,000</td><td></td><td></td><td></td><td></td></tr></table></section><div class="section">決算整理事項</div><section class="card"><ol class="adjust"><li>期末商品棚卸高は <b>${Y(p.endInv)}円</b>。売上原価は仕入勘定で算定する。</li><li>売掛金の期末残高に対して2%の貸倒引当金を差額補充法で設定する。</li><li>建物は残存価額ゼロ、耐用年数25年の定額法で減価償却する。</li><li>地代家賃のうち <b>${Y(p.prepaid)}円</b> は翌期分である。</li><li>税引前当期純利益の30%を法人税、住民税及び事業税として計上する。中間納付はない。</li></ol></section>`}
function adjustedHtml(){return `<div class="section">答案：決算整理後残高試算表</div><section class="card wrap"><table class="fs"><tr><th>勘定科目</th><th>借方</th><th>貸方</th></tr>${[['現金','cashD','',p.cash],['売掛金','arD','',p.ar],['貸倒引当金','','allowC',p.allowance],['繰越商品','invD','',p.endInv],['前払家賃','preD','',p.prepaid],['建物','buildD','',p.building],['建物減価償却累計額','','accC',p.accDep],['買掛金','','apC',p.ap],['未払法人税等','','taxC',p.tax],['資本金','','capC',p.capital],['繰越利益剰余金','','retC',p.retained],['売上','','salesC',p.sales],['仕入','cogsD','',p.cogs],['給料','salD','',p.salary],['地代家賃','rentD','',p.rentExp],['水道光熱費','utilD','',p.utilities],['貸倒引当金繰入','badD','',p.badDebt],['減価償却費','depD','',p.dep],['法人税、住民税及び事業税','taxD','',p.tax]].map(([n,dk,ck,v])=>`<tr><td>${n}</td><td>${dk?I(dk):empty()}</td><td>${ck?I(ck):empty()}</td></tr>`).join('')}</table></section><section class="card"><b>当期純利益</b> ${I('net')}</section>`}
function statementsHtml(){return `<div class="section">答案：損益計算書・貸借対照表</div><div class="two"><section class="card wrap"><h3>損益計算書</h3><table class="fs"><tr><td>売上高</td><td class="num given">5,500,000</td></tr><tr><td>売上原価</td><td>${I('cogs')}</td></tr><tr><td>売上総利益</td><td>${I('gross')}</td></tr><tr><td>給料</td><td class="num given">900,000</td></tr><tr><td>地代家賃</td><td>${I('rentExp')}</td></tr><tr><td>水道光熱費</td><td class="num given">180,000</td></tr><tr><td>貸倒引当金繰入</td><td>${I('badDebt')}</td></tr><tr><td>減価償却費</td><td>${I('dep')}</td></tr><tr><td>税引前当期純利益</td><td>${I('pretax')}</td></tr><tr><td>法人税等</td><td>${I('tax')}</td></tr><tr><th>当期純利益</th><th>${I('net')}</th></tr></table></section><section class="card wrap"><h3>貸借対照表</h3><table class="fs"><tr><td>現金</td><td class="num given">420,000</td></tr><tr><td>売掛金</td><td class="num given">600,000</td></tr><tr><td>貸倒引当金（控除）</td><td>${I('allowance')}</td></tr><tr><td>商品</td><td>${I('endInv')}</td></tr><tr><td>前払家賃</td><td>${I('prepaid')}</td></tr><tr><td>建物</td><td class="num given">3,000,000</td></tr><tr><td>建物減価償却累計額（控除）</td><td>${I('accDep')}</td></tr><tr><td>買掛金</td><td class="num given">430,000</td></tr><tr><td>未払法人税等</td><td>${I('tax')}</td></tr><tr><td>資本金</td><td class="num given">2,000,000</td></tr><tr><td>繰越利益剰余金</td><td>${I('retainedEnd')}</td></tr><tr><th>資産合計</th><th>${I('assets')}</th></tr></table></section></div>`}
function worksheetHtml(){const rows=[['繰越商品',p.openInv,0,{adjD:p.endInv,adjC:p.openInv,plD:0,plC:0,bsD:p.endInv,bsC:0}],['仕入',p.purchases,0,{adjD:p.openInv,adjC:p.endInv,plD:p.cogs,plC:0,bsD:0,bsC:0}],['売掛金',p.ar,0,{adjD:0,adjC:0,plD:0,plC:0,bsD:p.ar,bsC:0}],['貸倒引当金',0,p.allowBefore,{adjD:0,adjC:p.badDebt,plD:0,plC:0,bsD:0,bsC:p.allowance}],['貸倒引当金繰入',0,0,{adjD:p.badDebt,adjC:0,plD:p.badDebt,plC:0,bsD:0,bsC:0}],['建物減価償却累計額',0,p.accDepBefore,{adjD:0,adjC:p.dep,plD:0,plC:0,bsD:0,bsC:p.accDep}],['減価償却費',0,0,{adjD:p.dep,adjC:0,plD:p.dep,plC:0,bsD:0,bsC:0}],['地代家賃',p.rent,0,{adjD:0,adjC:p.prepaid,plD:p.rentExp,plC:0,bsD:0,bsC:0}],['前払家賃',0,0,{adjD:p.prepaid,adjC:0,plD:0,plC:0,bsD:p.prepaid,bsC:0}],['法人税等',0,0,{adjD:p.tax,adjC:0,plD:p.tax,plC:0,bsD:0,bsC:0}],['未払法人税等',0,0,{adjD:0,adjC:p.tax,plD:0,plC:0,bsD:0,bsC:p.tax}],['売上',0,p.sales,{adjD:0,adjC:0,plD:0,plC:p.sales,bsD:0,bsC:0}],['給料',p.salary,0,{adjD:0,adjC:0,plD:p.salary,plC:0,bsD:0,bsC:0}],['水道光熱費',p.utilities,0,{adjD:0,adjC:0,plD:p.utilities,plC:0,bsD:0,bsC:0}]];p.wsAnswers={};const body=rows.map((r,i)=>{const [n,d,c,x]=r;const cells=['adjD','adjC','plD','plC','bsD','bsC'].map(k=>{if(!x[k])return `<td>${empty()}</td>`;const key=`w${i}_${k}`;p.wsAnswers[key]=x[k];return `<td>${I(key)}</td>`}).join('');return `<tr><td>${n}</td><td class="num given">${d?Y(d):''}</td><td class="num given">${c?Y(c):''}</td>${cells}</tr>`}).join('');return `<div class="section">答案：精算表</div><section class="card wrap"><div class="note">必要な欄だけ入力します。横にスクロールできます。</div><table class="ws"><tr><th rowspan="2">勘定科目</th><th colspan="2">整理前</th><th colspan="2">整理記入</th><th colspan="2">損益計算書</th><th colspan="2">貸借対照表</th></tr><tr><th>借</th><th>貸</th><th>借</th><th>貸</th><th>借</th><th>貸</th><th>借</th><th>貸</th></tr>${body}</table></section><section class="card"><b>当期純利益</b> ${I('net')}</section>`}
function answers(){const base={cashD:p.cash,arD:p.ar,allowC:p.allowance,invD:p.endInv,preD:p.prepaid,buildD:p.building,accC:p.accDep,apC:p.ap,taxC:p.tax,capC:p.capital,retC:p.retained,salesC:p.sales,cogsD:p.cogs,salD:p.salary,rentD:p.rentExp,utilD:p.utilities,badD:p.badDebt,depD:p.dep,taxD:p.tax,net:p.net,cogs:p.cogs,gross:p.gross,rentExp:p.rentExp,badDebt:p.badDebt,dep:p.dep,pretax:p.pretax,tax:p.tax,allowance:p.allowance,endInv:p.endInv,prepaid:p.prepaid,accDep:p.accDep,retainedEnd:p.retainedEnd,assets:p.assets};return Object.assign(base,p.wsAnswers||{})}
function pickedMode(){return mode==='random'?pick(['adjusted','worksheet','statements']):mode}function make(){scenario();common.innerHTML=commonHtml();const m=pickedMode();p.mode=m;answerArea.innerHTML=m==='adjusted'?adjustedHtml():m==='worksheet'?worksheetHtml():statementsHtml();result.classList.remove('show');window.scrollTo(0,0)}function val(el){return Number((el.value||'').replace(/,/g,''))}function gradeAll(){const ans=answers(),inputs=[...document.querySelectorAll('.ans')];let correct=0;inputs.forEach(el=>{const ok=val(el)===ans[el.dataset.k];el.classList.toggle('ok',ok);el.classList.toggle('ng',!ok);if(ok)correct++});const rate=Math.round(correct/inputs.length*100);score.textContent=`${correct} / ${inputs.length}（${rate}%）`;summary.textContent=rate>=80?'決算整理から答案表への転記がかなり安定しています。':'赤い欄は、まず決算整理仕訳を作り、次にP/LかB/Sかを判断してみましょう。';explain.innerHTML=`売上原価＝${Y(p.openInv)}＋${Y(p.purchases)}−${Y(p.endInv)}＝<b>${Y(p.cogs)}</b>。貸倒引当金は ${Y(p.ar)}×2%＝${Y(p.allowance)}、差額補充額は <b>${Y(p.badDebt)}</b>。減価償却費は <b>${Y(p.dep)}</b>、地代家賃は ${Y(p.rent)}−${Y(p.prepaid)}＝<b>${Y(p.rentExp)}</b>。税引前利益は <b>${Y(p.pretax)}</b>、法人税等は <b>${Y(p.tax)}</b>、当期純利益は <b>${Y(p.net)}</b>。B/Sは資産合計 ${Y(p.assets)}＝負債・純資産合計 ${Y(p.liabEquity)} です。`;let s;try{s=JSON.parse(localStorage.getItem('boki3_q3_cbt_v2')||'{}')}catch{s={}}s.answered=(s.answered||0)+inputs.length;s.correct=(s.correct||0)+correct;s.lastRate=rate;s.lastMode=p.mode;s.lastAt=Date.now();localStorage.setItem('boki3_q3_cbt_v2',JSON.stringify(s));result.classList.add('show');result.scrollIntoView({behavior:'smooth',block:'start'})}
modebar.innerHTML=MODES.map(([k,n])=>`<button data-mode="${k}" class="${k===mode?'active':''}">${n}</button>`).join('');modebar.onclick=e=>{const b=e.target.closest('button[data-mode]');if(!b)return;mode=b.dataset.mode;modebar.querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b));make()};grade.onclick=gradeAll;next.onclick=make;make();
</script></body></html>
