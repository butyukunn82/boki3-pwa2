ne);border-radius:9px;padding:5px 8px;background:var(--u-card)}.qhead{display:flex;justify-content:space-between;align-items:center}.reason{display:flex;gap:5px;flex-wrap:wrap}.reason button{border:1px solid var(--u-line);border-radius:999px;background:var(--u-card);padding:6px 8px}.accountlink{color:#1f67aa;text-decoration:underline dotted 2px;cursor:pointer}.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:60;padding:18px;align-items:center;justify-content:center}.modal.show{display:flex}.modal>div{background:var(--u-card);color:var(--u-text);border-radius:16px;max-width:580px;width:100%;max-height:86vh;overflow:auto;padding:15px}

const STORE='boki3_q1_trainer_v1';function fresh(){return{answered:0,correct:0,totalTime:0,bySkill:{},byQ:{},history:{},errorReasons:{},sessions:[]}}let data;try{data=JSON.parse(localStorage.getItem(STORE)||'null')||fresh()}catch{data=fresh()}function save(){localStorage.setItem(STORE,JSON.stringify(data));updateHome()}function dayKey(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function fmt(n){return Number(n).toLocaleString('ja-JP')}
function nav(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');document.body.classList.toggle('quiz-mode',id==='quiz');scrollTo(0,0)}function skillRate(k){const v=data.bySkill[k];return v?.seen?Math.round(v.correct/v.seen*100)+'%':'-'}function updateHome(){document.getElementById('statA').textContent=data.answered;document.getElementById('statP').textContent=data.answered?Math.round(data.correct/data.answered*100)+'%':'-';document.getElementById('statClass').textContent=skillRate('5要素');document.getElementById('statJournal').textContent=skillRate('仕訳')}updateHome();
let session={mode:'',list:[],index:0,correct:0,answered:false,start:0,timer:null,responses:{}};function record(id,skill,ok,sec,dont=false){if(session.responses[session.index]?.recorded)return;session.responses[session.index]={recorded:true,ok,dont};data.answered++;if(ok)data.correct++;data.totalTime+=sec;data.bySkill[skill]=data.bySkill[skill]||{seen:0,correct:0,time:0};data.bySkill[skill].seen++;data.bySkill[skill].correct+=ok?1:0;data.bySkill[skill].time+=sec;const q=data.byQ[id]=data.byQ[id]||{seen:0,correct:0,wrong:0,dont:0,reviewDebt:0};q.seen++;if(ok){q.correct++;q.reviewDebt=Math.max(0,(q.reviewDebt||0)-1)}else{q.wrong++;q.reviewDebt=(q.reviewDebt||0)+2;if(dont)q.dont++}const k=dayKey();data.history[k]=data.history[k]||{answered:0,correct:0,time:0};data.history[k].answered++;data.history[k].correct+=ok?1:0;data.history[k].time+=sec;save()}
function startTimer(){clearInterval(session.timer);session.start=Date.now();session.timer=setInterval(()=>{const s=Math.floor((Date.now()-session.start)/1000);document.getElementById('timer').textContent=`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`},500)}function stopTimer(){clearInterval(session.timer);return (Date.now()-session.start)/1000}
function baseList(mode){let pool=BOKI_ACCOUNT_TERMS;if(mode==='basic')pool=BOKI_ACCOUNTS.filter(x=>x.difficulty<=1&&!x.role);if(mode==='special')pool=BOKI_ACCOUNTS.filter(x=>x.role||x.element==='その他');return shuffle(pool)}
function startClassify(kind){session={mode:'classify',kind,list:baseList(kind).slice(0,kind==='all'?40:20),index:0,correct:0,answered:false,responses:{}};nav('quiz');renderClassify()}function startWeak(){const ids=Object.entries(data.byQ).sort((a,b)=>(b[1].reviewDebt||0)-(a[1].reviewDebt||0)).map(x=>x[0]).filter(x=>x.startsWith('ACC:'));const list=ids.map(id=>BOKI_ACCOUNT_TERMS.find(x=>'ACC:'+x.name===id)).filter(Boolean);session={mode:'classify',kind:'weak',list:(list.length?list:shuffle(BOKI_ACCOUNT_TERMS)).slice(0,15),index:0,correct:0,answered:false,responses:{}};nav('quiz');renderClassify()}
function renderNav(){return `<div class="quiznav"><button class="u-btn u-ghost" onclick="prevQ()" ${session.index===0?'disabled':''}>← 前</button><button class="u-btn u-danger" onclick="endSession()">終了</button><button class="u-btn u-primary" id="nextBtn" onclick="nextQ()" ${session.answered?'':'disabled'}>${session.index===session.list.length-1?'結果':'次 →'}</button></div>`}function showAccount(x){document.getElementById('modalBody').innerHTML=`<div class="u-flex" style="justify-content:space-between"><h2>${x.name}</h2><button class="u-btn u-ghost" onclick="document.getElementById('modal').classList.remove('show')">×</button></div><div class="route4"><div><b>5要素</b><br>${x.element}</div><div><b>通常残高</b><br>${x.normalSide}</div><div><b>決算書</b><br>${x.statement}</div><div><b>翌期</b><br>${x.carry?'繰越す':'直接は繰越さない'}</div></div>${x.role?`<div class="specialbox"><b>${x.role}</b><br>${x.desc}</div>`:''}${x.pair?`<div class="u-note"><b>関連：</b>${x.pair}</div>`:''}`;document.getElementById('modal').classList.add('show')}
function renderClassify(){clearInterval(session.timer);const x=session.list[session.index];session.answered=false;document.getElementById('progress').textContent=`${session.index+1}/${session.list.length}`;document.getElementById('timer').textContent='00:00';document.getElementById('quizCard').innerHTML=`<div class="element-question"><span class="element-label">5要素分類</span><p>次の勘定科目はどの要素に分類される？</p><h2 class="accountlink" onclick="showAccount(findBokiAccount('${x.name}'))">${x.name}</h2></div><div id="choices"><div class="five-map"><button class="choice asset" data-value="資産" onclick="answerClassify(this,'資産')"><span>資産<span class="mini">B/S・借方で増える</span></span></button><button class="choice liability" data-value="負債" onclick="answerClassify(this,'負債')"><span>負債<span class="mini">B/S・貸方で増える</span></span></button><button class="choice equity" data-value="純資産" onclick="answerClassify(this,'純資産')"><span>純資産<span class="mini">B/S・貸方で増える</span></span></button><button class="choice expense" data-value="費用" onclick="answerClassify(this,'費用')"><span>費用<span class="mini">P/L・借方で増える</span></span></button><button class="choice revenue" data-value="収益" onclick="answerClassify(this,'収益')"><span>収益<span class="mini">P/L・貸方で増える</span></span></button></div><button class="choice special-choice" data-value="その他" onclick="answerClassify(this,'その他')">特殊・整理 <span style="font-size:.7rem;font-weight:700">（現金過不足・損益など）</span></button></div><div class="quiz-tip">5つの要素に当てはめてから、特殊な整理勘定かを考えよう。</div><div class="u-actions"><button class="u-btn u-secondary" onclick="answerClassify(null,'',true)">？ 分からない</button></div><div id="feedback" class="feedback"></div>${renderNav()}`;startTimer()}
function answerClassify(btn,val,dont=false){if(session.answered)return;session.answered=true;const x=session.list[session.index],sec=stopTimer(),ok=!dont&&val===x.element;if(ok)session.correct++;record('ACC:'+x.name,'5要素',ok,sec,dont);document.querySelectorAll('#choices .choice').forEach(b=>{b.disabled=true;if(b.dataset.value===x.element)b.classList.add('correct')});if(btn&&!ok)btn.classList.add('wrong');document.getElementById('feedback').classList.add('show');document.getElementById('feedback').innerHTML=`<div class="result-banner ${ok?'good':'bad'}">${ok?'○ 正解　よくできました！':dont?'△ 分からない → 正解は '+x.element:'× 不正解 → 正解は '+x.element}</div><div class="route4" style="margin-top:9px"><div><b>5要素</b><br>${x.element}</div><div><b>増える側</b><br>${x.normalSide}</div><div><b>決算書</b><br>${x.statement}</div><div><b>翌期</b><br>${x.carry?'繰越す':'直接は繰越さない'}</div></div>${x.role?`<div class="specialbox"><b>★ ${x.role}</b><br>${x.desc}</div>`:''}${x.pair?`<div class="u-note"><b>相棒・関連：</b>${x.pair}</div>`:''}`;document.getElementById('nextBtn').disabled=false}
function startDebitCredit(){const els=BOKI_ACCOUNTS.filter(x=>x.element!=='その他');const list=[];for(let i=0;i<24;i++){const x=els[Math.floor(Math.random()*els.length)],inc=Math.random()>.5;let ans;if(x.role==='資産の控除評価勘定')ans=inc?'貸方':'借方';else{const normal=x.normalSide;ans=inc?normal:(normal==='借方'?'貸方':'借方')}list.push({x,inc,ans,id:`DC:${x.name}:${inc?'up':'down'}:${i}`})}session={mode:'dc',list,index:0,correct:0,answered:false,responses:{}};nav('quiz');renderDC()}
function renderDC(){clearInterval(session.timer);const z=session.list[session.index];session.answered=false;document.getElementById('progress').textContent=`${session.index+1}/${session.list.length}`;document.getElementById('quizCard').innerHTML=`<span class="u-badge">借方・貸方</span><div class="question">${z.x.name}</div><div class="qbody" style="text-align:center">この勘定が<strong>${z.inc?'増える':'減る'}</strong>ときは？</div><div class="choicegrid dc-grid"><button class="choice" onclick="answerDC(this,'借方')">← 借方</button><button class="choice" onclick="answerDC(this,'貸方')">貸方 →</button></div><div class="u-actions"><button class="u-btn u-secondary" onclick="answerDC(null,'',true)">分からない</button></div><div id="feedback" class="feedback"></div>${renderNav()}`;startTimer()}
function answerDC(btn,val,dont=false){if(session.answered)return;session.answered=true;const z=session.list[session.index],sec=stopTimer(),ok=!dont&&val===z.ans;if(ok)session.correct++;record(z.id,'借貸',ok,sec,dont);document.querySelectorAll('.choice').forEach(b=>{b.disabled=true;if(b.textContent.includes(z.ans))b.classList.add('correct')});if(btn&&!ok)btn.classList.add('wrong');document.getElementById('feedback').classList.add('show');document.getElementById('feedback').innerHTML=`<div class="u-card ${ok?'u-good':'u-bad'}"><b>${z.ans}</b></div><div class="u-note" style="margin-top:8px">${z.x.role?`「${z.x.name}」は${z.x.role}なので通常残高は${z.x.normalSide}。`:`${z.x.element}は${z.x.normalSide}で増え、反対側で減ります。`}</div>`;document.getElementById('nextBtn').disabled=false}
// Journal question generator
function q4(){const n=(a,b=0)=>Math.round((a+Math.random()*b)/1000)*1000;const amt=n(30000,170000),amt2=n(2000,18000);const templates=[
 ()=>({body:`商品 ${fmt(amt)}円を掛けで販売した。`,d:[['売掛金',amt]],c:[['売上',amt]]}),
 ()=>({body:`商品 ${fmt(amt)}円を掛けで仕入れた。`,d:[['仕入',amt]],c:[['買掛金',amt]]}),
 ()=>({body:`商品 ${fmt(amt)}円を現金で販売した。`,d:[['現金',amt]],c:[['売上',amt]]}),
 ()=>({body:`商品 ${fmt(amt)}円を現金で仕入れた。`,d:[['仕入',amt]],c:[['現金',amt]]}),
 ()=>({body:`売掛金 ${fmt(amt)}円を普通預金へ振り込まれて回収した。`,d:[['普通預金',amt]],c:[['売掛金',amt]]}),
 ()=>({body:`買掛金 ${fmt(amt)}円を普通預金から支払った。`,d:[['買掛金',amt]],c:[['普通預金',amt]]}),
 ()=>({body:`備品 ${fmt(amt)}円を購入し、代金は現金で支払った。`,d:[['備品',amt]],c:[['現金',amt]]}),
 ()=>({body:`銀行から ${fmt(amt)}円を借り入れ、普通預金に入金された。`,d:[['普通預金',amt]],c:[['借入金',amt]]}),
 ()=>({body:`借入金 ${fmt(amt)}円と利息 ${fmt(amt2)}円を普通預金から支払った。`,d:[['借入金',amt],['支払利息',amt2]],c:[['普通預金',amt+amt2]]}),
 ()=>{const tax=Math.round(amt*.1);return{body:`商品 ${fmt(amt)}円（税抜）を掛けで仕入れた。消費税率10%、税抜方式。`,d:[['仕入',amt],['仮払消費税',tax]],c:[['買掛金',amt+tax]]}},
 ()=>{const gross=300000,tax=10000,soc=40000,net=gross-tax-soc;return{body:`給料総額 ${fmt(gross)}円から所得税 ${fmt(tax)}円、社会保険料 ${fmt(soc)}円を控除し、差額を普通預金から支払った。`,d:[['給料',gross]],c:[['所得税預り金',tax],['社会保険料預り金',soc],['普通預金',net]]}},
 ()=>({body:`当期分の未払利息 ${fmt(amt2)}円を決算整理で計上する。`,d:[['支払利息',amt2]],c:[['未払利息',amt2]]}),
 ()=>({body:`保険料のうち翌期分 ${fmt(amt2)}円を前払として決算整理する。`,d:[['前払保険料',amt2]],c:[['保険料',amt2]]}),
 ()=>({body:`備品の当期減価償却費 ${fmt(amt2)}円を間接法で計上する。`,d:[['減価償却費',amt2]],c:[['備品減価償却累計額',amt2]]}),
 ()=>({body:`貸倒引当金の不足額 ${fmt(amt2)}円を差額補充法で計上する。`,d:[['貸倒引当金繰入',amt2]],c:[['貸倒引当金',amt2]]})
 ];return templates[Math.floor(Math.random()*templates.length)]()}
function jtext(q){const side=(rows)=>rows.map(x=>`${x[0]} ${fmt(x[1])}`).join('・');return `（借）${side(q.d)} ／ （貸）${side(q.c)}`}
function wrongJ(q){const correct=jtext(q),arr=[];const swap={body:q.body,d:q.c,c:q.d};arr.push(jtext(swap));const total=q.d.reduce((s,x)=>s+x[1],0);if(q.d.length===1&&q.c.length===1){arr.push(`（借）${q.d[0][0]} ${fmt(total)} ／ （貸）買掛金 ${fmt(total)}`);arr.push(`（借）売掛金 ${fmt(total)} ／ （貸）${q.c[0][0]} ${fmt(total)}`)}else{arr.push(`（借）${q.d[0][0]} ${fmt(total)} ／ （貸）${q.c[0][0]} ${fmt(total)}`)}const pool=['現金','普通預金','売掛金','買掛金','仕入','売上','未払金','前払金','借入金','備品'];let guard=0;while(new Set(arr.filter(x=>x!==correct)).size<3&&guard++<40){let d=pool[Math.floor(Math.random()*pool.length)],c=pool[Math.floor(Math.random()*pool.length)];if(d===c)continue;arr.push(`（借）${d} ${fmt(total)} ／ （貸）${c} ${fmt(total)}`)}return [...new Set(arr.filter(x=>x!==correct))].slice(0,3)}
function startJournal4(){const list=Array.from({length:20},(_,i)=>{const z=q4();z.id='J4:'+i+':'+z.body;return z});session={mode:'j4',list,index:0,correct:0,answered:false,responses:{}};nav('quiz');renderJ4()}
function renderJ4(){clearInterval(session.timer);const z=session.list[session.index],correct=jtext(z),opts=shuffle([correct,...wrongJ(z)]);session.answered=false;document.getElementById('progress').textContent=`${session.index+1}/${session.list.length}`;document.getElementById('quizCard').innerHTML=`<span class="u-badge">4択仕訳</span><div class="qbody">${z.body}</div><div class="choicegrid j4-grid" id="choices">${opts.map(o=>`<button class="choice" onclick='answerJ4(this,${JSON.stringify(o)})'>${o}</button>`).join('')}</div><div class="u-actions"><button class="u-btn u-secondary" onclick="answerJ4(null,'',true)">分からない</button></div><div id="feedback" class="feedback"></div>${renderNav()}`;startTimer()}
function answerJ4(btn,val,dont=false){if(session.answered)return;session.answered=true;const z=session.list[session.index],ans=jtext(z),sec=stopTimer(),ok=!dont&&val===ans;if(ok)session.correct++;record(z.id,'仕訳',ok,sec,dont);document.querySelectorAll('#choices .choice').forEach(b=>{b.disabled=true;if(b.textContent===ans)b.classList.add('correct')});if(btn&&!ok)btn.classList.add('wrong');const steps=[...z.d.map(x=>`${x[0]}が増える／発生する → ${findBokiAccount(x[0])?.element||''} → 借方`),...z.c.map(x=>`${x[0]}が増える／減る → ${findBokiAccount(x[0])?.element||''} → 貸方`)];document.getElementById('feedback').classList.add('show');document.getElementById('feedback').innerHTML=`<div class="u-card ${ok?'u-good':'u-bad'}"><b>${ok?'○ 正解':'正解：'+ans}</b></div><div class="u-note" style="margin-top:8px">${steps.join('<br>')}</div>`;document.getElementById('nextBtn').disabled=false}
function startDropdown(){const list=Array.from({length:15},(_,i)=>{const z=q4();z.id='JD:'+i+':'+z.body;return z});session={mode:'drop',list,index:0,correct:0,answered:false,responses:{}};nav('quiz');renderDrop()}
function renderDrop(){clearInterval(session.timer);const z=session.list[session.index];session.answered=false;document.getElementById('progress').textContent=`${session.index+1}/${session.list.length}`;const names=['—',...shuffle(BOKI_ACCOUNTS.map(x=>x.name))],amounts=['—',...shuffle([...new Set([...z.d,...z.c].map(x=>x[1]).concat([z.d.reduce((s,x)=>s+x[1],0),z.c.reduce((s,x)=>s+x[1],0)]))])];const options=arr=>arr.map(x=>`<option>${typeof x==='number'?fmt(x):x}</option>`).join('');const rows=side=>Array.from({length:3},(_,i)=>`<div class="jrow"><select class="acct ${side}" data-row="${i}">${options(names)}</select><select class="amt ${side}" data-row="${i}">${options(amounts)}</select></div>`).join('');document.getElementById('quizCard').innerHTML=`<span class="u-badge">プルダウン仕訳</span><div class="qbody">${z.body}</div><div class="journal"><div class="jcol"><h3>← 借方</h3>${rows('debit')}</div><div class="jcol"><h3>貸方 →</h3>${rows('credit')}</div></div><div class="u-small">不要な行は「—」のまま。複合仕訳は行の順番が違っても正解になります。</div><div class="u-actions"><button class="u-btn u-primary" onclick="gradeDrop()">回答する</button><button class="u-btn u-secondary" onclick="gradeDrop(true)">分からない</button></div><div id="feedback" class="feedback"></div>${renderNav()}`;startTimer()}
function selectedRows(side){const ac=[...document.querySelectorAll(`.acct.${side}`)],am=[...document.querySelectorAll(`.amt.${side}`)];return ac.map((a,i)=>[a.value,Number(am[i].value.replaceAll(',',''))]).filter(x=>x[0]!=='—'&&x[1]).map(x=>x[0]+'|'+x[1]).sort()}
function expected(rows){return rows.map(x=>x[0]+'|'+x[1]).sort()}function gradeDrop(dont=false){if(session.answered)return;const z=session.list[session.index],d=selectedRows('debit'),c=selectedRows('credit'),ok=!dont&&JSON.stringify(d)===JSON.stringify(expected(z.d))&&JSON.stringify(c)===JSON.stringify(expected(z.c));session.answered=true;const sec=stopTimer();if(ok)session.correct++;record(z.id,'仕訳',ok,sec,dont);document.getElementById('feedback').classList.add('show');document.getElementById('feedback').innerHTML=`<div class="u-card ${ok?'u-good':'u-bad'}"><b>${ok?'○ 正解':'正解：'+jtext(z)}</b></div>`;document.getElementById('nextBtn').disabled=false;document.querySelectorAll('select').forEach(x=>x.disabled=true)}
function prevQ(){if(session.index<=0)return;session.index--;renderByMode()}function nextQ(){if(!session.answered)return;if(session.index>=session.list.length-1){complete();return}session.index++;renderByMode()}function renderByMode(){if(session.mode==='classify')renderClassify();else if(session.mode==='dc')renderDC();else if(session.mode==='j4')renderJ4();else renderDrop()}function endSession(){if(confirm('ここまでの学習履歴を保存して終了しますか？')){clearInterval(session.timer);localStorage.setItem('boki3_last_page','q1.html');nav('home')}}function complete(){clearInterval(session.timer);const total=session.list.length,p=Math.round(session.correct/total*100);document.getElementById('quizCard').innerHTML=`<div style="text-align:center;padding:24px"><div style="font-size:2rem;font-weight:900;color:var(--u-navy)">${session.correct}/${total}</div><h2>学習終了</h2><p>正答率 ${p}%</p><div class="u-actions"><button class="u-btn u-primary" onclick="nav('home')">メニューへ</button><a class="u-btn u-ghost" href="management.html" style="text-decoration:none;text-align:center">学習管理</a></div></div>`}
const mode=new URLSearchParams(location.search).get('mode');if(mode==='classify')startClassify('basic');
</script></body></html>
