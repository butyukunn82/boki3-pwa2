function recs(t){return t.qs.map((_,i)=>window.BOKI_MASTERY?.get?.(t.module,`C26:${t.id}:${i+1}`,{topic:t.name,skill:'2026範囲補強'})).filter(Boolean)}
function topicState(t){const rs=recs(t),seen=rs.reduce((s,x)=>s+(x.seen||0),0),mastered=rs.filter(x=>window.BOKI_MASTERY?.isMastered?.(x)).length;return{seen,mastered,total:rs.length,label:mastered===rs.length&&rs.length?'習熟':seen?'学習中':'未回答'}}
function renderTopics(){document.getElementById('topics').innerHTML=TOPICS.map(t=>{const s=topicState(t),cls=s.label==='習熟'?'mastered':s.seen?'started':'';return `<a class="topic" href="coverage.html?topic=${t.id}"><span><b>${t.name}</b><small>${t.desc}・${t.qs.length}問</small></span><span class="stat ${cls}">${s.label}</span></a>`}).join('')}
function start(topicId,book=false){bookMode=book;const start=TOPICS.findIndex(t=>t.id===topicId);if(book){sequence=TOPICS.slice(start<0?0:start);topicIndex=0;qIndex=0}else{sequence=start>=0?[TOPICS[start]]:TOPICS;topicIndex=0;qIndex=0}score=0;answered=false;started=Date.now();document.getElementById('home').hidden=true;document.getElementById('done').hidden=true;document.getElementById('quiz').hidden=false;renderQ()}
function current(){const t=sequence[topicIndex];return{t,q:t.qs[qIndex]}}
function renderQ(){const {t,q}=current(),total=bookMode?sequence.length:sequence.reduce((s,x)=>s+x.qs.length,0),done=bookMode?topicIndex:sequence.slice(0,topicIndex).reduce((s,x)=>s+x.qs.length,0)+qIndex;answered=false;document.getElementById('progress').textContent=bookMode?`問題帳 ${topicIndex+1} / ${total}`:`${done+1} / ${total}`;document.getElementById('pbar').style.width=`${(done+1)/total*100}%`;document.getElementById('topicName').textContent=t.name;const opts=[...q[2]].sort(()=>Math.random()-.5);document.getElementById('card').innerHTML=`<span class="badge">${esc(t.name)}</span><h2>${esc(q[0])}</h2><div class="body">${esc(q[1])}</div><div class="choices">${opts.map(o=>`<button class="choice" data-v="${esc(o)}">${esc(o)}</button>`).join('')}</div><div class="feedback" id="feedback"></div><div class="actions"><a class="secondary" href="questions.html">問題帳へ戻る</a><button class="primary" id="next" disabled>${bookMode?'次の項目へ →':'次の問題へ →'}</button></div>`;document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>answer(b));document.getElementById('next').onclick=next}
function answer(btn){if(answered)return;answered=true;const {t,q}=current(),ok=btn.dataset.v===q[3],sec=(Date.now()-started)/1000;document.querySelectorAll('.choice').forEach(b=>{b.disabled=true;if(b.dataset.v===q[3])b.classList.add('correct')});if(!ok)btn.classList.add('wrong');if(ok)score++;window.BOKI_MASTERY?.record?.(t.module,`C26:${t.id}:${qIndex+1}`,ok,sec,false,{topic:t.name,skill:'2026範囲補強'});const f=document.getElementById('feedback');f.classList.add('show');f.innerHTML=`<div class="result ${ok?'good':'bad'}">${ok?'○ 正解':'× 不正解　正解：'+esc(q[3])}</div><div class="explain">${esc(q[4])}</div>`;document.getElementById('next').disabled=false}
function next(){if(bookMode){topicIndex++;qIndex=0;if(topicIndex>=sequence.length)return finish();renderQ();return}qIndex++;if(qIndex>=sequence[topicIndex].qs.length){topicIndex++;qIndex=0}if(topicIndex>=sequence.length)return finish();renderQ()}
function finish(){document.getElementById('quiz').hidden=true;const total=bookMode?sequence.length:sequence.reduce((s,x)=>s+x.qs.length,0);document.getElementById('done').hidden=false;document.getElementById('done').innerHTML=`<div class="complete"><div class="big">${score}/${total}</div><h2>${bookMode?'問題帳の順番学習':'補強ドリル'} 完了</h2><p>回答した内容は習熟度へ記録されました。</p><div class="actions"><a class="primary" href="questions.html">問題帳へ</a><a class="secondary" href="coverage.html">補強論点一覧へ</a></div></div>`}
renderTopics();const p=new URLSearchParams(location.search),id=p.get('topic');if(id)setTimeout(()=>start(id,p.get('book')==='1'),120);
</script></body></html>
