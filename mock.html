<style>
:root{--navy:#173b67;--blue:#2f6fad;--green:#1d6a3b;--bg:#f4f7fb;--card:#fff;--line:#cfdbe7;--text:#243244;--muted:#6b7b8e;--good:#177647;--bad:#b43a3a;--warn:#a06916}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI",Meiryo,sans-serif;line-height:1.55}.app{max-width:1120px;margin:auto;padding-bottom:86px}.top{position:sticky;top:0;z-index:50;background:rgba(23,59,103,.98);color:#fff;padding:10px 13px;display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;box-shadow:0 2px 12px rgba(0,0,0,.12)}.top small{display:block;opacity:.88}.timer{font:950 1.08rem ui-monospace,monospace;padding:7px 10px;border-radius:10px;background:rgba(255,255,255,.13);min-width:72px;text-align:center}.timer.warn{background:#8e5d12}.timer.danger{background:#a92f2f}.page{padding:14px}.hero,.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:0 7px 22px rgba(30,60,90,.06)}.hero{background:linear-gradient(135deg,#173b67,#287bc2);color:#fff}.hero h1{margin:0 0 5px;font-size:1.4rem}.hero p{margin:0;font-size:.84rem;opacity:.94}.note{font-size:.78rem;color:var(--muted)}.hero .note{color:rgba(255,255,255,.88)}.rules{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:12px}.rule{background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.2);border-radius:12px;padding:9px;text-align:center}.rule b{display:block;font-size:1.1rem}.rule span{font-size:.72rem}.start{width:100%;min-height:58px;border:0;border-radius:14px;background:#176bc1;color:#fff;font-size:1rem;font-weight:950;margin-top:10px;cursor:pointer}.start:active{transform:scale(.995)}.section-nav{position:sticky;top:64px;z-index:40;display:grid;grid-template-columns:repeat(3,1fr);gap:7px;background:rgba(244,247,251,.95);backdrop-filter:blur(8px);padding:8px 0}.section-nav button{border:1px solid var(--line);background:#fff;border-radius:11px;min-height:48px;font-weight:900;color:#42566e;cursor:pointer}.section-nav button.active{background:var(--navy);color:#fff;border-color:var(--navy)}.section-nav small{display:block;font-size:.65rem;opacity:.78}.exam-section{display:none}.exam-section.active{display:block}.section-head{display:flex;justify-content:space-between;align-items:end;gap:12px;margin:12px 2px 8px}.section-head h2{margin:0;color:var(--navy);font-size:1.15rem}.section-head span{font-size:.76rem;color:var(--muted)}.qcard{background:#fff;border:1px solid var(--line);border-radius:15px;padding:13px;margin-bottom:10px}.qno{display:inline-block;background:#eaf3ff;color:#245c92;border-radius:999px;padding:3px 8px;font-size:.7rem;font-weight:900}.qbody{font-size:.88rem;margin:8px 0 10px}.entry{display:grid;grid-template-columns:1fr 110px 20px 1fr 110px;gap:6px;align-items:center}.entry select,.entry input,.tbl select,.tbl input,.fs input{width:100%;min-height:42px;border:2px solid var(--line);border-radius:8px;background:#fff;padding:6px;font-size:16px}.entry input,.tbl input,.fs input{text-align:right}.slash{text-align:center;font-weight:900;color:#65788d}.empty-row{opacity:.55}.ok{border-color:#69bd8e!important;background:#f0fbf5!important}.ng{border-color:#df8b8b!important;background:#fff2f2!important}.wrap{overflow:auto}.tbl,.fs{border-collapse:collapse;width:100%;min-width:650px;font-size:.82rem}.tbl th,.tbl td,.fs th,.fs td{border:1px solid #9eb0c3;padding:7px;text-align:center}.tbl th,.fs th{background:#eaf0f6}.given{background:#f7f9fc}.theory-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}.theory{border:1px solid #dce5ee;border-radius:11px;padding:10px}.theory b{display:block;font-size:.8rem;margin-bottom:6px}.theory select{width:100%;min-height:42px;border:2px solid var(--line);border-radius:8px;background:#fff;font-size:16px}.adjust{font-size:.84rem;line-height:1.75}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.fs td:first-child{text-align:left}.num{text-align:right!important}.bottom{position:fixed;bottom:0;left:0;right:0;z-index:60;background:rgba(255,255,255,.98);border-top:1px solid var(--line);padding:8px}.bottom-inner{max-width:1120px;margin:auto;display:grid;grid-template-columns:1fr 1fr;gap:8px}.bottom button{min-height:50px;border-radius:12px;font-weight:950;font-size:.92rem;cursor:pointer}.ghost{background:#fff;border:1px solid var(--line);color:#40556d}.finish{border:0;background:#173b67;color:#fff}.result{display:none}.result.show{display:block}.result-main{text-align:center}.score{font-size:3.2rem;font-weight:950;color:var(--navy);line-height:1}.judge{display:inline-block;margin-top:8px;border-radius:999px;padding:6px 13px;font-weight:950}.judge.pass{background:#e8f7ee;color:#176b41}.judge.fail{background:#fff0e4;color:#975715}.parts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}.part{border:1px solid var(--line);border-radius:12px;padding:10px}.part b{display:block;font-size:1.25rem;color:var(--navy)}.result-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.result-actions a,.result-actions button{display:grid;place-items:center;min-height:50px;border-radius:12px;text-decoration:none;font-weight:900}.review{border:1px solid var(--line);background:#fff;color:#40556d}.again{border:0;background:#176bc1;color:#fff}@media(max-width:760px){.entry{grid-template-columns:1fr 95px}.entry .slash{display:none}.entry .credit-account{grid-column:1}.entry .credit-amount{grid-column:2}.two{grid-template-columns:1fr}.theory-grid{grid-template-columns:1fr}.page{padding:10px}.rules{grid-template-columns:1fr 1fr 1fr}.section-nav{top:61px}.score{font-size:2.7rem}}

<body>
<div class="app">
<header class="top"><div><b>日商簿記3級 60分模試</b><small>第1問 → 第2問 → 第3問</small></div><div id="timer" class="timer">60:00</div></header>
<main class="page">
<section id="intro"><div class="hero"><h1>本試験型 60分模試</h1><p>選択式＋入力式で3題を通して解きます。問題はこのアプリ用のオリジナルです。</p><div class="rules"><div class="rule"><b>45点</b><span>第1問 仕訳15問</span></div><div class="rule"><b>20点</b><span>第2問 帳簿・勘定</span></div><div class="rule"><b>35点</b><span>第3問 決算</span></div></div><div class="note" style="margin-top:10px">配点は学習用です。公式の採点内容・基準・方法を示すものではありません。合否表示は70点以上を目安にしています。</div></div><div class="card"><b>操作</b><div class="note">仕訳の勘定科目はプルダウン、金額は数字のみ入力します。大問は自由に移動できます。60分で自動終了します。</div></div><button id="start" class="start">▶ 模試を開始する</button></section>
<section id="exam" hidden><div class="section-nav"><button data-sec="q1" class="active">第1問<small>仕訳 45点</small></button><button data-sec="q2">第2問<small>帳簿 20点</small></button><button data-sec="q3">第3問<small>決算 35点</small></button></div><section id="q1" class="exam-section active"><div class="section-head"><h2>第1問　仕訳</h2><span>15問 × 3点</span></div><div id="q1list"></div></section><section id="q2" class="exam-section"><div class="section-head"><h2>第2問　帳簿・勘定</h2><span>10欄 × 2点</span></div><div id="q2area"></div></section><section id="q3" class="exam-section"><div class="section-head"><h2>第3問　決算</h2><span>14欄・計35点</span></div><div id="q3area"></div></section></section>
<section id="result" class="result"></section>
</main></div>
<div id="bottom" class="bottom" hidden><div class="bottom-inner"><button id="nextSec" class="ghost">次の大問へ</button><button id="finish" class="finish">終了して採点</button></div></div>
<script>
const ACCOUNTS=['現金','普通預金','当座預金','売掛金','買掛金','未払金','前払金','前受金','仮払金','仮受金','未収入金','立替金','仕入','売上','備品','建物','支払手数料','旅費交通費','給料','法定福利費','所得税預り金','社会保険料預り金','前払保険料','保険料','支払利息','未払利息','減価償却費','備品減価償却累計額','貸倒引当金繰入','貸倒引当金','仮受消費税','仮払消費税','未払消費税','償却債権取立益','法人税等','未払法人税等','繰越利益剰余金','未払配当金','利益準備金','損益','繰越商品'];
const Y=n=>Number(n).toLocaleString('ja-JP');const pick=a=>a[Math.floor(Math.random()*a.length)];const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};let state={started:false,ended:false,startAt:0,left:3600,q1:[],q2:null,q3:null,current:'q1'};
function jr(text,debits,credits){return{text,debits,credits}}
function buildQ1(){const qs=[jr('商品120,000円を掛けで販売した。',[['売掛金',120000]],[['売上',120000]]),jr('商品85,000円を掛けで仕入れた。',[['仕入',85000]],[['買掛金',85000]]),jr('売掛金70,000円が普通預金に振り込まれた。',[['普通預金',70000]],[['売掛金',70000]]),jr('備品180,000円を購入し、代金は翌月支払うこととした。',[['備品',180000]],[['未払金',180000]]),jr('出張に先立ち、従業員へ旅費概算額30,000円を現金で渡した。',[['仮払金',30000]],[['現金',30000]]),jr('普通預金に25,000円の入金があったが内容は不明である。',[['普通預金',25000]],[['仮受金',25000]]),jr('給料総額240,000円から所得税12,000円、社会保険料36,000円を控除し、差額を普通預金から支払った。',[['給料',240000]],[['所得税預り金',12000],['社会保険料預り金',36000],['普通預金',192000]]),jr('会社負担分の社会保険料38,000円を計上し、未払いとした。',[['法定福利費',38000]],[['未払金',38000]]),jr('保険料のうち翌期分24,000円を決算整理で前払へ振り替える。',[['前払保険料',24000]],[['保険料',24000]]),jr('当期分の未払利息6,000円を決算整理で計上する。',[['支払利息',6000]],[['未払利息',6000]]),jr('備品の当期減価償却費60,000円を間接法で計上する。',[['減価償却費',60000]],[['備品減価償却累計額',60000]]),jr('貸倒引当金の不足額4,000円を差額補充法で計上する。',[['貸倒引当金繰入',4000]],[['貸倒引当金',4000]]),jr('商品100,000円（税抜）を掛けで販売した。消費税10%、税抜方式。',[['売掛金',110000]],[['売上',100000],['仮受消費税',10000]]),jr('前期に貸倒処理した売掛金20,000円を当期に現金で回収した。',[['現金',20000]],[['償却債権取立益',20000]]),jr('株主総会で配当金80,000円と利益準備金8,000円の積立てを決議した。',[['繰越利益剰余金',88000]],[['未払配当金',80000],['利益準備金',8000]])];return shuffle(qs)}
function accountOptions(){return '<option value="">選択</option>'+ACCOUNTS.map(x=>`<option>${x}</option>`).join('')}
function renderQ1(){const list=document.getElementById('q1list');list.innerHTML=state.q1.map((q,i)=>`<div class="qcard" data-q1="${i}"><span class="qno">${i+1}</span><div class="qbody">${q.text}</div>${[0,1,2].map(r=>`<div class="entry" style="margin-top:${r?6:0}px"><select data-side="d" data-row="${r}">${accountOptions()}</select><input data-side="d" data-row="${r}" inputmode="numeric" placeholder="金額"><div class="slash">／</div><select class="credit-account" data-side="c" data-row="${r}">${accountOptions()}</select><input class="credit-amount" data-side="c" data-row="${r}" inputmode="numeric" placeholder="金額"></div>`).join('')}</div>`).join('')}
function makeQ2(){const sales=[pick([800,900,1000,1100]),pick([700,850,950,1050]),pick([900,1000,1200,1300])].map(x=>x*1000);const purchases=[pick([500,600,700,800]),pick([650,750,850,950]),pick([700,900,1000,1100])].map(x=>x*1000);const openInv=pick([300,350,400,450])*1000;let closeInv=pick([220,260,300,340])*1000;if(closeInv===openInv)closeInv-=40000;const salesTotal=sales.reduce((a,b)=>a+b,0),purchaseTotal=purchases.reduce((a,b)=>a+b,0),cogs=openInv+purchaseTotal-closeInv;const theory=shuffle([{q:'当期中に発生した売掛金が貸倒れになった。直接処理に用いる費用勘定は？',a:'貸倒損失',o:['貸倒損失','貸倒引当金','償却債権取立益','雑損']},{q:'株主への配当に伴い、一定額まで積み立てる純資産の勘定は？',a:'利益準備金',o:['利益準備金','資本金','未払配当金','繰越利益剰余金']},{q:'前期に貸倒処理した売掛金を当期に回収したときの収益勘定は？',a:'償却債権取立益',o:['償却債権取立益','受取利息','雑益','売上']},{q:'商品以外の固定資産を売却し、代金を後日受け取る場合の債権は？',a:'未収入金',o:['未収入金','売掛金','受取手形','前受金']}]).slice(0,2);return{sales,purchases,openInv,closeInv,salesTotal,purchaseTotal,cogs,theory}}
function renderQ2(){const p=state.q2,labels=['前期繰越','次期繰越','売上','仕入','繰越商品','損益'];const opts='<option value="">選択</option>'+labels.map(x=>`<option>${x}</option>`).join('');document.getElementById('q2area').innerHTML=`<div class="card"><div class="note">3分法。期首商品 <b>${Y(p.openInv)}円</b>、期末商品 <b>${Y(p.closeInv)}円</b>。期中売上 ${p.sales.map(Y).join('円、')}円、期中仕入 ${p.purchases.map(Y).join('円、')}円。売上原価は仕入勘定で算定します。</div></div><div class="card wrap"><table class="tbl"><thead><tr><th colspan="3">売上</th><th colspan="3">仕入</th></tr><tr><th>日付</th><th>摘要</th><th>金額</th><th>日付</th><th>摘要</th><th>金額</th></tr></thead><tbody><tr><td>3/31</td><td><select data-q2="salesCloseLabel">${opts}</select></td><td><input data-q2="salesTotal" inputmode="numeric"></td><td>4/1</td><td><select data-q2="openLabel">${opts}</select></td><td><input data-q2="openInv" inputmode="numeric"></td></tr><tr><td class="given">期中</td><td class="given">売掛金ほか</td><td class="given">${Y(p.salesTotal)}</td><td>3/31</td><td><select data-q2="closeLabel">${opts}</select></td><td><input data-q2="closeInv" inputmode="numeric"></td></tr><tr><td></td><td></td><td></td><td>3/31</td><td><select data-q2="cogsLabel">${opts}</select></td><td><input data-q2="cogs" inputmode="numeric"></td></tr><tr><td></td><td></td><td></td><td class="given">期中</td><td class="given">買掛金ほか</td><td class="given">${Y(p.purchaseTotal)}</td></tr></tbody></table></div><div class="theory-grid">${p.theory.map((x,i)=>`<div class="theory"><b>${i+1}. ${x.q}</b><select data-q2theory="${i}"><option value="">選択</option>${shuffle(x.o).map(v=>`<option>${v}</option>`).join('')}</select></div>`).join('')}</div>`}
function makeQ3(){const endInv=pick([220000,250000,280000]);const prepaidRent=pick([40000,60000,80000]);const sales=5500000,purchases=3200000,openInv=180000;const cogs=openInv+purchases-endInv,gross=sales-cogs,allowance=12000,badDebtExp=9000,depExp=120000,rentExp=360000-prepaidRent;const pretax=gross-900000-rentExp-180000-badDebtExp-depExp,tax=Math.round(pretax*.3),netIncome=pretax-tax,accDep=720000,retainedEnd=307000+netIncome;const assetsTotal=420000+600000-allowance+endInv+prepaidRent+3000000-accDep;return{endInv,prepaidRent,cogs,gross,allowance,badDebtExp,depExp,rentExp,pretax,tax,netIncome,accDep,retainedEnd,assetsTotal}}
function row(name,key,given,bold){return `<tr><${bold?'th':'td'}>${name}</${bold?'th':'td'}><${bold?'th':'td'}>${key?`<input data-q3="${key}" inputmode="numeric">`:`<span class="num">${given}</span>`}</${bold?'th':'td'}></tr>`}
function renderQ3(){const p=state.q3;document.getElementById('q3area').innerHTML=`<div class="card wrap"><b>決算整理前残高試算表</b><table class="tbl" style="margin-top:8px"><thead><tr><th>勘定科目</th><th>借方</th><th>貸方</th><th>勘定科目</th><th>借方</th><th>貸方</th></tr></thead><tbody><tr><td>現金</td><td class="num">420,000</td><td></td><td>買掛金</td><td></td><td class="num">430,000</td></tr><tr><td>売掛金</td><td class="num">600,000</td><td></td><td>貸倒引当金</td><td></td><td class="num">3,000</td></tr><tr><td>繰越商品</td><td class="num">180,000</td><td></td><td>建物減価償却累計額</td><td></td><td class="num">600,000</td></tr><tr><td>建物</td><td class="num">3,000,000</td><td></td><td>資本金</td><td></td><td class="num">2,000,000</td></tr><tr><td>仕入</td><td class="num">3,200,000</td><td></td><td>繰越利益剰余金</td><td></td><td class="num">307,000</td></tr><tr><td>給料</td><td class="num">900,000</td><td></td><td>売上</td><td></td><td class="num">5,500,000</td></tr><tr><td>地代家賃</td><td class="num">360,000</td><td></td><td></td><td></td><td></td></tr><tr><td>水道光熱費</td><td class="num">180,000</td><td></td><td></td><td></td><td></td></tr></tbody></table></div><div class="card"><b>決算整理事項</b><ol class="adjust"><li>期末商品棚卸高は <b>${Y(p.endInv)}円</b>。売上原価は仕入勘定で計算する。</li><li>売掛金の期末残高に対して2%の貸倒引当金を差額補充法で設定する。</li><li>建物は残存価額ゼロ、耐用年数25年の定額法で減価償却する。</li><li>地代家賃のうち <b>${Y(p.prepaidRent)}円</b> は翌期分なので前払家賃へ振り替える。</li><li>税引前当期純利益の30%を法人税等として計上する。中間納付はない。</li></ol></div><div class="two"><div class="card wrap"><b>損益計算書</b><table class="fs" style="margin-top:8px"><tbody>${row('売上高',null,'5,500,000')}${row('売上原価','cogs')}${row('売上総利益','gross')}${row('給料',null,'900,000')}${row('地代家賃','rentExp')}${row('水道光熱費',null,'180,000')}${row('貸倒引当金繰入','badDebtExp')}${row('減価償却費','depExp')}${row('税引前当期純利益','pretax')}${row('法人税等','tax')}${row('当期純利益','netIncome',null,true)}</tbody></table></div><div class="card wrap"><b>貸借対照表</b><table class="fs" style="margin-top:8px"><tbody>${row('現金',null,'420,000')}${row('売掛金',null,'600,000')}${row('貸倒引当金（控除）','allowance')}${row('商品','endInv')}${row('前払家賃','prepaidRent')}${row('建物',null,'3,000,000')}${row('建物減価償却累計額（控除）','accDep')}${row('買掛金',null,'430,000')}${row('未払法人税等','tax')}${row('資本金',null,'2,000,000')}${row('繰越利益剰余金','retainedEnd')}${row('資産合計','assetsTotal',null,true)}</tbody></table></div></div>`}
function switchSec(sec){state.current=sec;document.querySelectorAll('.exam-section').forEach(x=>x.classList.toggle('active',x.id===sec));document.querySelectorAll('.section-nav button').forEach(x=>x.classList.toggle('active',x.dataset.sec===sec));window.scrollTo({top:0,behavior:'smooth'});nextSec.textContent=sec==='q1'?'第2問へ':sec==='q2'?'第3問へ':'第1問へ'}
document.querySelectorAll('.section-nav button').forEach(b=>b.onclick=()=>switchSec(b.dataset.sec));nextSec.onclick=()=>switchSec(state.current==='q1'?'q2':state.current==='q2'?'q3':'q1');function num(v){return Number(String(v||'').replace(/,/g,''))}
function actualSide(card,side){return [...card.querySelectorAll(`[data-side="${side}"][data-row]`)].reduce((acc,el)=>{if(el.tagName==='SELECT'){const row=el.dataset.row,amt=card.querySelector(`input[data-side="${side}"][data-row="${row}"]`);if(el.value||amt.value)acc.push([el.value,num(amt.value)])}return acc},[])}function normPairs(a){return a.filter(x=>x[0]||x[1]).map(x=>[x[0],Number(x[1])]).sort((x,y)=>(x[0]+x[1]).localeCompare(y[0]+y[1]))}function samePairs(a,b){return JSON.stringify(normPairs(a))===JSON.stringify(normPairs(b))}
function gradeQ1(){let correct=0;document.querySelectorAll('[data-q1]').forEach(card=>{const q=state.q1[+card.dataset.q1],ok=samePairs(actualSide(card,'d'),q.debits)&&samePairs(actualSide(card,'c'),q.credits);card.style.borderColor=ok?'#69bd8e':'#df8b8b';card.style.background=ok?'#f7fff9':'#fff8f8';if(ok)correct++});return{correct,total:15,score:correct*3}}
function gradeQ2(){const p=state.q2,ans={salesCloseLabel:'損益',salesTotal:p.salesTotal,openLabel:'繰越商品',openInv:p.openInv,closeLabel:'繰越商品',closeInv:p.closeInv,cogsLabel:'損益',cogs:p.cogs};let correct=0,total=0;document.querySelectorAll('[data-q2]').forEach(el=>{total++;const exp=ans[el.dataset.q2],got=el.tagName==='INPUT'?num(el.value):el.value,ok=got===exp;el.classList.toggle('ok',ok);el.classList.toggle('ng',!ok);if(ok)correct++});document.querySelectorAll('[data-q2theory]').forEach(el=>{total++;const ok=el.value===p.theory[+el.dataset.q2theory].a;el.classList.toggle('ok',ok);el.classList.toggle('ng',!ok);if(ok)correct++});return{correct,total,score:correct*2}}
function gradeQ3(){const p=state.q3,inputs=[...document.querySelectorAll('[data-q3]')];let correct=0;inputs.forEach(el=>{const ok=num(el.value)===Number(p[el.dataset.q3]);el.classList.toggle('ok',ok);el.classList.toggle('ng',!ok);if(ok)correct++});return{correct,total:14,score:correct*2.5}}
function finishExam(auto=false){if(state.ended)return;if(!auto&&!confirm('模試を終了して採点しますか？'))return;state.ended=true;clearInterval(state.tick);const a=gradeQ1(),b=gradeQ2(),c=gradeQ3(),total=a.score+b.score+c.score,pass=total>=70;exam.hidden=true;bottom.hidden=true;result.innerHTML=`<div class="card result-main"><div class="note">${auto?'60分が経過したため自動採点しました。':'模試結果'}</div><div class="score">${Number.isInteger(total)?total:total.toFixed(1)}点</div><div class="judge ${pass?'pass':'fail'}">${pass?'70点以上':'70点未満'}</div><div class="parts"><div class="part"><span>第1問</span><b>${a.score}/45</b><small>${a.correct}/15問</small></div><div class="part"><span>第2問</span><b>${b.score}/20</b><small>${b.correct}/${b.total}欄</small></div><div class="part"><span>第3問</span><b>${Number.isInteger(c.score)?c.score:c.score.toFixed(1)}/35</b><small>${c.correct}/14欄</small></div></div><div class="note">赤く表示された箇所を確認してから、個別の本番形式で反復してください。</div><div class="result-actions"><button class="review" id="reviewBtn">答案を見直す</button><button class="again" id="againBtn">もう一度受ける</button></div></div>`;result.classList.add('show');result.scrollIntoView({behavior:'smooth'});document.getElementById('reviewBtn').onclick=()=>{result.classList.remove('show');result.style.display='none';exam.hidden=false;switchSec('q1')};document.getElementById('againBtn').onclick=()=>location.reload();let hist;try{hist=JSON.parse(localStorage.getItem('boki3_mock_cbt_v2')||'[]')}catch{hist=[]}hist.unshift({at:Date.now(),score:total,q1:a.score,q2:b.score,q3:c.score,auto});localStorage.setItem('boki3_mock_cbt_v2',JSON.stringify(hist.slice(0,20)))}finish.onclick=()=>finishExam(false);
function tick(){const elapsed=Math.floor((Date.now()-state.startAt)/1000);state.left=Math.max(0,3600-elapsed);const m=Math.floor(state.left/60),s=state.left%60;timer.textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;timer.classList.toggle('warn',state.left<=600&&state.left>300);timer.classList.toggle('danger',state.left<=300);if(state.left<=0)finishExam(true)}
start.onclick=()=>{state.started=true;state.startAt=Date.now();state.q1=buildQ1();state.q2=makeQ2();state.q3=makeQ3();renderQ1();renderQ2();renderQ3();intro.hidden=true;exam.hidden=false;bottom.hidden=false;switchSec('q1');tick();state.tick=setInterval(tick,1000)};timer.textContent='60:00';
</script>
</body>
</html>
