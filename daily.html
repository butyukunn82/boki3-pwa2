ding:11px 12px;font-weight:800;color:var(--u-text);cursor:pointer}.choice:active{transform:scale(.99)}.choice.correct{border-color:#55b878;background:#eefaf2;color:#17723a}.choice.wrong{border-color:#dc7777;background:#fff0f0;color:#aa3030}.choice:disabled{opacity:1}.feedback{display:none;margin-top:11px;border-radius:13px;padding:11px 12px;font-size:.86rem}.feedback.show{display:block}.feedback.good{background:#eefaf2;border:1px solid #9ed2af;color:#1b663a}.feedback.bad{background:#fff7e7;border:1px solid #e6c986;color:#76571a}.nav{display:grid;grid-template-columns:1fr 1.2fr 1fr;gap:8px;margin-top:12px;position:sticky;bottom:0;background:#fff;padding:9px 0 calc(8px + env(safe-area-inset-bottom,0px))}.nav button,.nav a{min-height:52px;border:0;border-radius:13px;font-weight:900;display:grid;place-items:center;text-decoration:none}.prev{background:#edf1f5;color:#44566a}.unknown{background:#f7b828;color:#432e00}.next{background:#176bc1;color:#fff}.nav button:disabled{opacity:.38}.result{text-align:center;padding:18px 4px}.result .score{font-size:2.6rem;font-weight:950;color:#176bc1}.result-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:14px 0}.result-grid div{border:1px solid var(--u-line);border-radius:12px;padding:9px}.result-grid b{display:block}.weak-out{margin-top:10px;text-align:left;background:#fff7e7;border:1px solid #ead297;border-radius:13px;padding:10px}.actions{display:grid;gap:8px;margin-top:13px}.actions a,.actions button{min-height:54px;border:0;border-radius:14px;font-weight:900;text-decoration:none;display:grid;place-items:center}.primary{background:#176bc1;color:#fff}.secondary{background:#eef2f6;color:#364b63}@media(max-width:420px){.daily-hero{padding-right:92px}.daily-hero img{width:82px}.result-grid{grid-template-columns:1fr 1fr 1fr}}

<body class="app-v20 quiz-mode">
<div class="u-app"><header class="u-top"><div><div class="u-brand">あなた専用 今日の10問</div><div class="u-small">第1問・第2問・第3問を横断</div></div><a href="index.html">終了</a></header><main class="u-page">
<section id="intro">
<div class="daily-hero"><h1>今日、いちばん効く10問</h1><p>これまでの誤答・復習度・理解チェックから配分を自動調整します。</p><div class="mix" id="mix"></div><img src="mascot.png" alt="応援キャラクター"></div>

</main></div>

<script>
'use strict';
const CROSS='boki3_cross_learning_v1';
const safe=k=>{try{return JSON.parse(localStorage.getItem(k)||'null')||{}}catch{return {}}};
const q1=safe('boki3_q1_trainer_v1'),q2=safe('boki3trainer_v2'),q3=safe('boki3_q3_trainer_v1'),checks=safe('boki3_understanding_checks_v1');
let cross=safe(CROSS);cross.answered||=0;cross.correct||=0;cross.totalTime||=0;cross.byArea||={};cross.byTopic||={};cross.history||={};cross.recentWrong||=[];cross.sessions||=[];
const dateKey=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const shuffle=a=>{const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b};
const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const debtSum=d=>Object.values(d.byQ||{}).reduce((n,z)=>n+Number(z.reviewDebt??((z.wrong||0)+(z.slow||0))),0);
const crossDebt=src=>Object.entries(cross.byTopic||{}).filter(([k])=>k.startsWith(src+':')).reduce((n,[,z])=>n+Number(z.debt||0),0);
const penalty=d=>{const a=Number(d.answered||0),c=Number(d.correct||0);return a?Math.max(0,(1-c/a)*12):3};
function areaScores(){const checkPenalty=Object.values(checks||{}).reduce((n,z)=>{const b=Number(z.best??z.score??3);return n+(b<3?3-b:0)},0);return{q1:3+debtSum(q1)+crossDebt('q1')+penalty(q1),q2:3+debtSum(q2)+crossDebt('q2')+penalty(q2),q3:3+debtSum(q3)+crossDebt('q3')+penalty(q3)+checkPenalty*2}}
function quotas(){const s=areaScores(),q={q1:3,q2:3,q3:4};for(let r=0;r<2;r++){const hi=Object.keys(s).sort((a,b)=>s[b]-s[a])[0],lo=Object.keys(s).filter(k=>k!==hi).sort((a,b)=>s[a]-s[b])[0];if(s[hi]-s[lo]>2&&q[hi]<5&&q[lo]>2){q[hi]++;q[lo]--}}return q}
const areaLabel={q1:'第1問 仕訳',q2:'第2問 帳簿',q3:'第3問 決算'};
function weakestNative(d){const cats=Object.entries(d.byCat||{}).filter(([,v])=>v?.seen).map(([k,v])=>({k,p:(v.correct||0)/(v.seen||1)})).sort((a,b)=>a.p-b.p);return cats[0]?.k||''}
function weakAccounts(){return Object.entries(q1.byQ||{}).filter(([id])=>id.startsWith('ACC:')).sort((a,b)=>(b[1].reviewDebt||0)-(a[1].reviewDebt||0)).map(([id])=>findBokiAccount(id.slice(4))).filter(Boolean)}
function choose(arr,n){return shuffle(arr).slice(0,n)}
function mk(source,topic,q,answer,choices,exp){return{source,topic,q,answer,choices:shuffle([...new Set(choices)]),exp}}
function q1Questions(n){const weak=weakAccounts(),pool=weak.length?[...weak,...shuffle(BOKI_ACCOUNTS)]:shuffle(BOKI_ACCOUNTS),out=[];for(let i=0;i<n;i++){const x=pool[i%pool.length],kind=i%4;if(kind===0){const opts=shuffle(['資産','負債','純資産','収益','費用','その他'].filter(v=>v!==x.element)).slice(0,3);out.push(mk('q1','5要素',`「${x.name}」は5要素とその他のどこ？`,x.element,[x.element,...opts],`${x.name}は「${x.element}」。${x.role?x.role+'ですが、5要素上は'+x.element+'です。':''}`))}else if(kind===1){out.push(mk('q1','借方・貸方',`「${x.name}」の通常残高はどちら？`,x.normalSide,[x.normalSide,...shuffle(['借方','貸方','どちらでもない','期末だけ借方'].filter(v=>v!==x.normalSide)).slice(0,3)],`${x.name}の通常残高は${x.normalSide}です。`))}else if(kind===2){out.push(mk('q1','決算書',`「${x.name}」の主な行き先は？`,x.statement,[x.statement,...shuffle(['P/L','B/S','整理用','補助簿だけ'].filter(v=>v!==x.statement)).slice(0,3)],`${x.name}は${x.statement}へつながります。`))}else{const ans=x.carry?'翌期へ繰り越す':'直接は翌期へ繰り越さない';out.push(mk('q1','繰越',`「${x.name}」は翌期へ直接繰り越す？`,ans,[ans,...shuffle(['翌期へ繰り越す','直接は翌期へ繰り越さない','必ず現金へ振り替える','補助簿にだけ残す'].filter(v=>v!==ans)).slice(0,3)],`${x.element==='資産'||x.element==='負債'||x.element==='純資産'?'B/S科目は原則として翌期へつながります。':'収益・費用などは当期の成績として締めます。'}`))}}return out}
const Q2BANK=[
mk('q2','補助簿','得意先へ商品100,000円を掛けで売った。最も適切な記入先の組合せは？','売上帳・売掛金元帳・商品有高帳',['売上帳・売掛金元帳・商品有高帳','仕入帳・買掛金元帳・現金出納帳','固定資産台帳だけ','当座預金出納帳だけ'],'商品売上なので売上帳と商品有高帳、掛けなので得意先別の売掛金元帳にも記入します。'),
mk('q2','補助簿','備品150,000円を購入し、小切手を振り出した。記入する補助簿は？','当座預金出納帳・固定資産台帳',['当座預金出納帳・固定資産台帳','仕入帳・商品有高帳','売上帳・売掛金元帳','受取手形記入帳だけ'],'小切手振出は当座預金の減少、備品購入は固定資産台帳の対象です。'),
mk('q2','補助簿','商品80,000円を仕入れ、代金は現金で支払った。主な記入先は？','仕入帳・商品有高帳・現金出納帳',['仕入帳・商品有高帳・現金出納帳','売上帳・売掛金元帳','固定資産台帳だけ','受取手形記入帳だけ'],'商品仕入、在庫増加、現金支払の3つの動きをそれぞれ補助簿へ記録します。'),
mk('q2','商品有高帳','先入先出法の考え方として正しいものは？','先に仕入れた商品から先に払い出したと仮定する',['先に仕入れた商品から先に払い出したと仮定する','毎回すべて同じ単価に固定する','最も高い単価から必ず払い出す','期末商品を0とする'],'先入先出法は古い層から払い出し、期末には比較的新しい単価の在庫が残ります。'),
mk('q2','商品有高帳','在庫10個@100円の後、10個@140円を仕入れた。移動平均単価は？','120円',['120円','100円','140円','240円'],'(1,000+1,400)÷20個＝120円です。'),
mk('q2','伝票会計','一部現金取引を、全額掛取引＋現金決済に分けて起票する方法は？','分解法',['分解法','分割法','先入先出法','差額補充法'],'分解法は一度全額を掛けとみなし、現金部分を別伝票で決済します。'),
mk('q2','伝票会計','一部現金取引を、現金部分と掛け部分にそのまま分ける方法は？','分割法',['分割法','分解法','移動平均法','再振替仕訳'],'分割法は取引を現金部分と掛け部分へ素直に分けます。'),
mk('q2','勘定記入','資産勘定を締め切るとき、残高は通常どの語で翌期へつなぐ？','次期繰越',['次期繰越','損益','当期純利益','売上'],'資産・負債・純資産の残高は次期繰越として締め、翌期に前期繰越となります。'),
mk('q2','勘定記入','費用勘定を決算で締め切るとき、振替先は？','損益',['損益','次期繰越','現金','資本金'],'収益・費用は損益勘定へ振り替えて当期の成績を締めます。')];
function q2Questions(n){const weak=(weakestNative(q2)||'').replace(/\s/g,''),preferred=Q2BANK.filter(x=>weak&&x.topic.includes(weak)||weak&&weak.includes(x.topic));return choose([...preferred,...Q2BANK],n)}
const Q3BANK=[
mk('q3','前払費用','保険料120,000円のうち翌期分30,000円。決算整理後の当期保険料は？','90,000円',['90,000円','120,000円','150,000円','30,000円'],'翌期分は当期費用から除くので120,000−30,000＝90,000円です。'),
mk('q3','未払費用','当期の給料120,000円に未払給料30,000円を追加した。P/Lの給料はいくら？','150,000円',['150,000円','120,000円','90,000円','30,000円'],'未払いでも当期発生分は当期費用なので120,000＋30,000＝150,000円です。'),
mk('q3','貸倒引当金','売掛金200,000円に2%の貸倒引当金が必要。既存残高1,000円なら繰入額は？','3,000円',['3,000円','4,000円','1,000円','5,000円'],'必要額4,000円−既存1,000円＝繰入3,000円です。'),
mk('q3','減価償却','備品600,000円、耐用年数6年、残存価額0、定額法。1年分の減価償却費は？','100,000円',['100,000円','600,000円','60,000円','500,000円'],'600,000÷6年＝100,000円です。'),
mk('q3','売上原価','期首商品40,000円、仕入500,000円、期末商品50,000円。売上原価は？','490,000円',['490,000円','540,000円','510,000円','450,000円'],'期首40,000＋仕入500,000−期末50,000＝490,000円です。'),
mk('q3','P/L・B/S','前払保険料の決算整理で増えるB/S項目は？','資産',['資産','負債','純資産','収益'],'前払保険料は将来サービスを受ける権利なので資産です。'),
mk('q3','P/L・B/S','未払給料の決算整理で増えるB/S項目は？','負債',['負債','資産','純資産','収益'],'未払給料は将来支払う義務なので負債です。'),
mk('q3','締切・繰越','当期の売上は翌期首にどうなる？','売上勘定は0から始める',['売上勘定は0から始める','前期繰越として残す','現金へ振り替える','買掛金へ振り替える'],'収益は当期の成績なので損益へ振り替え、翌期は0から始めます。'),
mk('q3','締切・繰越','現金残高は翌期へどうなる？','前期繰越として引き継ぐ',['前期繰越として引き継ぐ','損益へ振り替える','0にする','売上へ振り替える'],'現金は資産で会社に残る状態なので翌期へ引き継ぎます。'),
mk('q3','全体像','簿記の基本的な処理順として正しいものは？','取引→仕訳→総勘定元帳→試算表→決算整理→決算書',['取引→仕訳→総勘定元帳→試算表→決算整理→決算書','決算書→仕訳→試算表→取引','試算表→取引→元帳→仕訳','仕訳→決算書→取引→元帳'],'現実の取引を仕訳し、科目別に元帳へ集め、試算表・決算整理を経て決算書につなげます。')];
function q3Questions(n){const weak=(weakestNative(q3)||'').replace(/\s/g,''),checkWeak=Object.entries(checks).filter(([,z])=>Number(z.best??z.score??3)<3).map(([k])=>k);const map={worksheet:['前払費用','未払費用','P/L・B/S'],ledger:['全体像'],carry:['締切・繰越'],lab:['全体像','貸倒引当金']};const preferred=Q3BANK.filter(x=>(weak&&x.topic.includes(weak))||checkWeak.some(k=>(map[k]||[]).includes(x.topic)));return choose([...preferred,...Q3BANK],n)}
function build(){const q=quotas(),items=[...q1Questions(q.q1),...q2Questions(q.q2),...q3Questions(q.q3)];return shuffle(items).map((x,i)=>({...x,id:`${x.source}:${x.topic}:${i}:${dateKey()}`,display:shuffle(x.choices)}))}
let list=build(),idx=0,responses={},startAt=0,timerId=null;
const quota=quotas(),scores=areaScores();document.getElementById('mix').innerHTML=Object.keys(quota).map(k=>`<span>${areaLabel[k]} ${quota[k]}問</span>`).join('');const ordered=Object.keys(scores).sort((a,b)=>scores[b]-scores[a]);document.getElementById('reasons').innerHTML=ordered.map((k,i)=>`<span>${i===0?'最優先 ':' '}${areaLabel[k]}</span>`).join('');
function tick(){const s=Math.floor((Date.now()-startAt)/1000);document.getElementById('timer').textContent=`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`}
function start(){document.getElementById('intro').hidden=true;document.getElementById('quiz').hidden=false;startAt=Date.now();timerId=setInterval(tick,500);render()}
function render(){if(idx>=list.length)return finish();const x=list[idx],r=responses[idx];document.getElementById('progress').textContent=`${idx+1} / ${list.length}`;document.getElementById('dots').innerHTML=list.map((_,i)=>`<i class="${i<idx?'done':i===idx?'now':''}"></i>`).join('');document.getElementById('card').innerHTML=`<span class="source ${x.source}">${areaLabel[x.source]}</span><span class="topic">${esc(x.topic)}</span><div class="qtext">${esc(x.q)}</div><div class="choices">${x.display.map(c=>`<button class="choice ${r?(c===x.answer?'correct':c===r.value&&!r.ok?'wrong':''):''}" data-val="${esc(c)}" ${r?'disabled':''}>${esc(c)}</button>`).join('')}</div><div class="feedback ${r?'show '+(r.ok?'good':'bad'):''}">${r?`<b>${r.ok?'○ 正解':'× 不正解'}</b><br>${esc(x.exp)}`:''}</div><div class="nav"><button class="prev" id="prev" ${idx===0?'disabled':''}>← 前</button><button class="unknown" id="unknown" ${r?'disabled':''}>？ 分からない</button><button class="next" id="next" ${r?'':'disabled'}>${idx===list.length-1?'結果':'次 →'}</button></div>`}
function record(value,unknown=false){if(responses[idx])return;const x=list[idx],ok=!unknown&&value===x.answer,sec=Math.max(.1,(Date.now()-startAt)/1000);responses[idx]={value:unknown?'分からない':value,ok,unknown};cross.answered++;if(ok)cross.correct++;cross.totalTime+=sec;const a=cross.byArea[x.source]||={seen:0,correct:0,wrong:0,debt:0};a.seen++;if(ok){a.correct++;a.debt=Math.max(0,(a.debt||0)-1)}else{a.wrong++;a.debt=(a.debt||0)+2}const key=x.source+':'+x.topic,t=cross.byTopic[key]||={seen:0,correct:0,wrong:0,debt:0};t.seen++;if(ok){t.correct++;t.debt=Math.max(0,(t.debt||0)-1)}else{t.wrong++;t.debt=(t.debt||0)+2;cross.recentWrong.unshift({source:x.source,topic:x.topic,q:x.q,date:dateKey(),ts:Date.now()});cross.recentWrong=cross.recentWrong.slice(0,50)}const dk=dateKey(),h=cross.history[dk]||={answered:0,correct:0,time:0};h.answered++;if(ok)h.correct++;h.time+=sec;localStorage.setItem(CROSS,JSON.stringify(cross));render()}
function finish(){clearInterval(timerId);const vals=Object.values(responses),correct=vals.filter(x=>x.ok).length,total=list.length,by={q1:[0,0],q2:[0,0],q3:[0,0]};list.forEach((x,i)=>{by[x.source][0]++;if(responses[i]?.ok)by[x.source][1]++});cross.sessions.push({date:dateKey(),total,correct,seconds:Math.round((Date.now()-startAt)/1000),mix:quota});cross.sessions=cross.sessions.slice(-100);localStorage.setItem(CROSS,JSON.stringify(cross));const weak=Object.entries(cross.byTopic).sort((a,b)=>(b[1].debt||0)-(a[1].debt||0)).slice(0,3).map(([k])=>k.split(':')[1]);document.getElementById('quiz').innerHTML=`<div class="qcard result"><img src="mascot.png" alt="応援キャラクター" style="width:92px"><div class="score">${correct}/${total}</div><h2>今日の10問 完了</h2><p>大問をまたいだ弱点履歴に今回の結果を反映しました。</p><div class="result-grid">${Object.keys(by).map(k=>`<div><span>${areaLabel[k]}</span><b>${by[k][1]}/${by[k][0]}</b></div>`).join('')}</div>${weak.length?`<div class="weak-out"><b>次回の優先候補</b><br>${weak.map(esc).join('・')}</div>`:''}<div class="actions"><button class="primary" onclick="location.reload()">別の10問を作る</button><a class="secondary" href="index.html">ホームへ</a></div></div>`}
document.getElementById('start').onclick=start;document.addEventListener('click',e=>{const c=e.target.closest('.choice');if(c)return record(c.dataset.val);if(e.target.id==='unknown')return record('',true);if(e.target.id==='prev'){idx=Math.max(0,idx-1);return render()}if(e.target.id==='next'){if(!responses[idx])return;idx++;return render()}});
</script></body></html>
