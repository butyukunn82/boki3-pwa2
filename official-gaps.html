let seq=[],ti=0,qi=0,score=0,answered=false,started=0,book=false;const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function stat(t){const rs=t.qs.map((_,i)=>window.BOKI_MASTERY?.get?.(t.module,`GAP4:${t.id}:${i+1}`,{topic:t.name,skill:'公式再監査補強'})).filter(Boolean),seen=rs.reduce((s,x)=>s+(x.seen||0),0),mastered=rs.length&&rs.every(x=>window.BOKI_MASTERY?.isMastered?.(x));return{seen,mastered,label:mastered?'習熟':seen?'学習中':'未回答'}}function renderList(){document.getElementById('list').innerHTML=T.map(t=>{const s=stat(t);return `<a class="topic" href="official-gaps.html?topic=${t.id}"><span><b>${t.name}</b><small>${t.desc}・4問</small></span><span class="badge ${s.mastered?'mastered':s.seen?'started':''}">${s.label}</span></a>`}).join('')}function start(id,b=false){const at=T.findIndex(x=>x.id===id);seq=b?T.slice(at<0?0:at):(at>=0?[T[at]]:T);ti=0;qi=0;score=0;book=b;document.getElementById('home').hidden=true;document.getElementById('done').hidden=true;document.getElementById('quiz').hidden=false;render()}function cur(){return{t:seq[ti],q:seq[ti].qs[qi]}}function render(){const {t,q}=cur(),total=book?seq.length:seq.reduce((s,x)=>s+x.qs.length,0),done=book?ti:seq.slice(0,ti).reduce((s,x)=>s+x.qs.length,0)+qi;answered=false;started=Date.now();document.getElementById('progress').textContent=book?`問題帳 ${ti+1}/${total}`:`${done+1}/${total}`;document.getElementById('pbar').style.width=`${(done+1)/total*100}%`;document.getElementById('name').textContent=t.name;const opts=[...q[1]].sort(()=>Math.random()-.5);document.getElementById('card').innerHTML=`<h2>${esc(q[0])}</h2><div class="choices">${opts.map(o=>`<button class="choice" data-v="${esc(o)}">${esc(o)}</button>`).join('')}</div><div id="feedback" class="feedback"></div><div class="actions"><a class="secondary" href="questions.html">問題帳へ</a><button class="primary" id="next" disabled>${book?'次の項目へ →':'次の問題へ →'}</button></div>`;document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>answer(b));document.getElementById('next').onclick=next}function answer(btn){if(answered)return;answered=true;const {t,q}=cur(),ok=btn.dataset.v===q[2],sec=(Date.now()-started)/1000;document.querySelectorAll('.choice').forEach(b=>{b.disabled=true;if(b.dataset.v===q[2])b.classList.add('correct')});if(!ok)btn.classList.add('wrong');if(ok)score++;window.BOKI_MASTERY?.record?.(t.module,`GAP4:${t.id}:${qi+1}`,ok,sec,false,{topic:t.name,skill:'公式再監査補強'});const f=document.getElementById('feedback');f.className='feedback show';f.innerHTML=`<div class="result ${ok?'good':'bad'}">${ok?'○ 正解':'× 不正解　正解：'+esc(q[2])}</div><div class="explain">${esc(q[3])}</div>`;document.getElementById('next').disabled=false}function next(){if(book){ti++;qi=0;if(ti>=seq.length)return finish();render();return}qi++;if(qi>=seq[ti].qs.length){ti++;qi=0}if(ti>=seq.length)return finish();render()}function finish(){document.getElementById('quiz').hidden=true;const total=book?seq.length:seq.reduce((s,x)=>s+x.qs.length,0);document.getElementById('done').hidden=false;document.getElementById('done').innerHTML=`<div class="complete"><div class="big">${score}/${total}</div><h2>補強完了</h2><p>回答は習熟履歴へ記録しました。</p><div class="actions"><a class="primary" href="questions.html">問題帳へ</a><a class="secondary" href="official-gaps.html">補強一覧へ</a></div></div>`}renderList();const p=new URLSearchParams(location.search),id=p.get('topic');if(id)setTimeout(()=>start(id,p.get('book')==='1'),120);
