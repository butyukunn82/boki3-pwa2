<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#173b67"><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="common.css"><link rel="stylesheet" href="app-v20.css"><title>実戦連結ドリル｜日商簿記3級トレーナー</title><style>
body{background:#f4f7fb;padding-bottom:88px}.wrap{max-width:780px;margin:auto;padding:14px}.hero{background:linear-gradient(135deg,#173b67,#2a76b8);color:#fff;border-radius:22px;padding:18px;box-shadow:0 10px 26px rgba(23,59,103,.2)}.hero h1{margin:0;font-size:1.35rem}.hero p{font-size:.8rem;line-height:1.6;margin:6px 0 0;opacity:.94}.hero-note{margin-top:10px;background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.2);border-radius:12px;padding:9px;font-size:.72rem}.scenario-list{display:grid;gap:9px;margin-top:12px}.scenario{background:#fff;border:1px solid #d9e3ed;border-radius:16px;padding:12px;text-decoration:none;color:inherit;display:grid;grid-template-columns:1fr auto;gap:9px;align-items:center;box-shadow:0 5px 16px rgba(30,60,90,.05)}.scenario b{display:block;color:#173b67}.scenario small{display:block;color:#687b8f;line-height:1.45;margin-top:3px}.scenario .badge{font-size:.66rem;border-radius:999px;padding:5px 8px;background:#eef3f7;color:#52677c;font-weight:900}.scenario .badge.started{background:#fff4d6;color:#795b0d}.scenario .badge.mastered{background:#e9f8ee;color:#216c43}.topline{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;margin-bottom:9px}.topline b{color:#173b67}.bar{height:9px;background:#e6ebf0;border-radius:999px;overflow:hidden;margin-top:5px}.bar i{display:block;height:100%;background:#2578bc}.card{background:#fff;border:1px solid #d9e3ed;border-radius:18px;padding:15px;box-shadow:0 7px 22px rgba(30,60,90,.06)}.labels{display:flex;gap:6px;flex-wrap:wrap}.label{border-radius:999px;padding:4px 8px;font-size:.68rem;font-weight:900}.label.module{background:#eaf3ff;color:#245f97}.label.step{background:#f1edff;color:#6049aa}.card h2{font-size:1.08rem;margin:10px 0;color:#263d55}.body{background:#f7faff;border-left:4px solid #2b7bc1;border-radius:9px;padding:11px;font-size:.86rem;line-height:1.65}.choices{display:grid;gap:8px;margin-top:12px}.choice{width:100%;border:2px solid #d6e0ea;background:#fff;border-radius:12px;padding:12px;text-align:left;font-size:.86rem;font-weight:800}.choice.correct{border-color:#2f8b58;background:#edf9f2}.choice.wrong{border-color:#bc4949;background:#fff1f1}.choice:disabled{opacity:1}.feedback{display:none;margin-top:11px}.feedback.show{display:block}.result{border-radius:11px;padding:10px;font-weight:900}.result.good{background:#eaf8ef;color:#216c43}.result.bad{background:#fff0f0;color:#9b3434}.explain{margin-top:7px;border:1px solid #e0e7ee;border-radius:11px;padding:10px;font-size:.79rem;line-height:1.6}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.actions button,.actions a{min-height:50px;border:0;border-radius:12px;text-decoration:none;display:grid;place-items:center;font-weight:900}.primary{background:#176bc1;color:#fff}.secondary{background:#eef3f7;color:#3c556d}.complete{background:#fff;border:1px solid #d9e3ed;border-radius:20px;padding:22px;text-align:center}.complete .big{font-size:2.2rem;font-weight:950;color:#173b67}.complete p{color:#687b8e}.pw-doc{margin:10px 0;border:1px solid #cad4df;background:#fff;border-radius:12px;padding:12px;box-shadow:0 4px 12px rgba(40,55,70,.06);font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.pw-doc-title{text-align:center;font-size:1.05rem;font-weight:950;letter-spacing:.18em;border-bottom:2px solid #dfe5eb;padding-bottom:7px}.pw-doc-row{display:flex;justify-content:space-between;gap:10px;margin-top:9px}.pw-doc-row b{font-size:1.05rem}.pw-doc-main{margin-top:9px;padding:8px;background:#f7f9fb;border-radius:7px}.pw-doc-foot{text-align:right;margin-top:8px;font-size:.72rem;color:#607080}.pw-table-wrap{overflow:auto;margin:10px 0}.pw-table{border-collapse:collapse;width:100%;min-width:500px;background:#fff;font-size:.74rem}.pw-table th,.pw-table td{border:1px solid #aebcca;padding:7px}.pw-table th{background:#eaf0f6;text-align:center}.pw-table td:nth-child(n+2){text-align:left}@media(max-width:430px){.actions{grid-template-columns:1fr}.scenario{grid-template-columns:minmax(0,1fr) auto}}</style></head><body><div class="wrap"><section id="home"><div class="hero"><h1>実戦連結ドリル</h1><p>本試験で初めて見る文章や表でも、「資料を読む→判断する→計算・仕訳する→次の処理へつなぐ」力を鍛えます。</p><div class="hero-note">一問一答ではなく、1つの資料を数ステップ続けて処理します。途中の答えを次の判断につなげる練習です。</div></div><div id="scenarios" class="scenario-list"></div><div class="actions"><a class="secondary" href="questions.html">← 問題帳</a><a class="primary" href="index.html">ホーム</a></div></section><section id="quiz" hidden><div class="topline"><div><b id="progress"></b><div class="bar"><i id="pbar"></i></div></div><span id="scenarioName"></span></div><div id="card" class="card"></div></section><section id="done" hidden></section></div><script src="mastery.js"></script><script src="practical-wave3.js"></script><script>
'use strict';
const C=window.BOKI_PRACTICAL_CATALOG||[];let seq=[],si=0,step=0,score=0,answered=false,started=0,book=false;
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function records(s){return s.steps.map((_,i)=>window.BOKI_MASTERY?.get?.(s.module,`W3:${s.id}:${i+1}`,{topic:s.name,skill:'実戦連結'})).filter(Boolean)}
function state(s){const rs=records(s),seen=rs.reduce((a,q)=>a+Number(q.seen||0),0),mastered=rs.length&&rs.every(q=>window.BOKI_MASTERY?.isMastered?.(q));return{seen,mastered,label:mastered?'習熟':seen?'学習中':'未回答'}}
function renderList(){document.getElementById('scenarios').innerHTML=C.map(s=>{const st=state(s),cl=st.mastered?'mastered':st.seen?'started':'';return `<a class="scenario" href="practical.html?topic=${s.id}"><span><b>${esc(s.name)}</b><small>${esc(s.desc)}・${s.steps.length}ステップ</small></span><span class="badge ${cl}">${st.label}</span></a>`}).join('')}
function start(id,bookMode=false){const at=C.findIndex(s=>s.id===id);seq=bookMode?C.slice(at<0?0:at):(at>=0?[C[at]]:C);si=0;step=0;score=0;book=bookMode;document.getElementById('home').hidden=true;document.getElementById('done').hidden=true;document.getElementById('quiz').hidden=false;render()}
function cur(){return{scenario:seq[si],q:seq[si].steps[step]}}
function totalSteps(){return seq.reduce((a,s)=>a+s.steps.length,0)}
function doneSteps(){return seq.slice(0,si).reduce((a,s)=>a+s.steps.length,0)+step}
function render(){const {scenario,q}=cur(),done=doneSteps(),total=totalSteps();answered=false;started=Date.now();document.getElementById('progress').textContent=book?`問題帳 ${si+1}/${seq.length}・STEP ${step+1}/${scenario.steps.length}`:`${done+1}/${total}・STEP ${step+1}/${scenario.steps.length}`;document.getElementById('pbar').style.width=`${(done+1)/Math.max(1,total)*100}%`;document.getElementById('scenarioName').textContent=scenario.name;const opts=[...q.choices].sort(()=>Math.random()-.5);document.getElementById('card').innerHTML=`<div class="labels"><span class="label module">${scenario.module==='q2'?'第2問':'第3問'}</span><span class="label step">STEP ${step+1}</span></div><h2>${esc(q.title)}</h2><div class="body">${esc(q.body)}</div>${q.visual||''}<div class="choices">${opts.map(o=>`<button class="choice" data-v="${esc(o)}">${esc(o)}</button>`).join('')}</div><div id="feedback" class="feedback"></div><div class="actions"><a class="secondary" href="questions.html">問題帳へ戻る</a><button id="next" class="primary" disabled>${step===scenario.steps.length-1?(book?'次の項目へ →':'結果を見る'):'次のSTEPへ →'}</button></div>`;document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>answer(b));document.getElementById('next').onclick=next}
function answer(btn){if(answered)return;answered=true;const {scenario,q}=cur(),ok=btn.dataset.v===q.answer,sec=Math.max(.1,(Date.now()-started)/1000);document.querySelectorAll('.choice').forEach(b=>{b.disabled=true;if(b.dataset.v===q.answer)b.classList.add('correct')});if(!ok)btn.classList.add('wrong');if(ok)score++;window.BOKI_MASTERY?.record?.(scenario.module,`W3:${scenario.id}:${step+1}`,ok,sec,false,{topic:scenario.name,skill:'実戦連結'});const f=document.getElementById('feedback');f.className='feedback show';f.innerHTML=`<div class="result ${ok?'good':'bad'}">${ok?'○ 正解':'× 不正解　正解：'+esc(q.answer)}</div><div class="explain">${esc(q.exp)}</div>`;document.getElementById('next').disabled=false}
function next(){const scenario=seq[si];if(step<scenario.steps.length-1){step++;render();return}si++;step=0;if(si>=seq.length){finish();return}render()}
function finish(){document.getElementById('quiz').hidden=true;const total=totalSteps();document.getElementById('done').hidden=false;document.getElementById('done').innerHTML=`<div class="complete"><div class="big">${score}/${total}</div><h2>実戦連結 完了</h2><p>資料を読み、複数の処理をつなげた結果を習熟度へ記録しました。</p><div class="actions"><a class="primary" href="questions.html">問題帳へ</a><a class="secondary" href="practical.html">実戦連結一覧へ</a></div></div>`}
renderList();const p=new URLSearchParams(location.search),id=p.get('topic');if(id)setTimeout(()=>start(id,p.get('book')==='1'),120);
</script></body></html>
